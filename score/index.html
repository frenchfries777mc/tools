<title>Fry Score · Frenchfries777 Tools</title>
<meta name="description" content="악보를 그리고 바로 들어 보는 도구. 음표를 찍고 여러 악기로 재생하고 MIDI·MusicXML·PNG로 받아요.">
<meta name="theme-color" content="#08090d">
<link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../icons/icon-192.png">

<link rel="stylesheet" href="css/style.css?v=sc33">
</head>
<body>
<div class="top">
  <a class="home" href="../" title="Tools 홈">🍟</a>
  <span class="brand">FRY <b>SCORE</b></span>
  <input id="dname" value="이름 없는 악보" aria-label="악보 이름" data-notr>
  <button class="tbtn" id="bUndo" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기">↶<span class="lb"> 되돌리기</span></button>
  <button class="tbtn" id="bRedo" title="다시 (Ctrl+Y)" aria-label="다시">↷<span class="lb"> 다시</span></button>
  <span class="sp"></span>
  <button class="tbtn pri" id="bPlay">▶ 재생</button>
  <button class="tbtn" id="bStop" aria-label="정지" title="정지">■</button>
  <button class="tbtn" id="bZm" aria-label="축소" title="축소">−</button><span class="zoom" id="zl">100%</span><button class="tbtn" id="bZp" aria-label="확대" title="확대">+</button>
  <button class="tbtn" id="bZf" aria-label="화면에 맞추기" title="화면에 맞추기">⤢</button>
  <button class="tbtn" id="bOpen">열기</button>
  <button class="tbtn pri" id="bSave">받기 ▾</button>
</div>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<div class="main">
  <div class="tools" id="tools" role="toolbar" aria-label="음표 도구"></div>
  <div class="center">
    <div class="desk" id="desk"><div class="stagew"><svg id="sheet" role="img" tabindex="0" xmlns="http://www.w3.org/2000/svg" aria-label="악보"></svg></div></div>
    <div class="pad" id="pad" hidden></div>
  </div>
  <div class="panel">
    <div class="ptabs" id="ptabs" role="tablist"><button data-p="note" class="on">음표</button><button data-p="song">악보</button><button data-p="parts">파트</button></div>
    <div class="pbody" id="pbody"></div>
  </div>
</div>
<input type="file" id="fileIn" accept=".fscore,.json,.mid,.midi,.musicxml,.xml,application/json" hidden>
<div id="printArea"></div>
<script src="../ai.js?v=ai36.l21"></script>
<script src="js/util.js?v=sc33"></script>
<script src="js/model.js?v=sc33"></script>
<script src="js/glyph.js?v=sc33"></script>

<script src="js/render.js?v=sc33"></script>
<script src="js/decor.js?v=sc33"></script>
<script src="js/audio.js?v=sc33"></script>
<script src="js/io.js?v=sc33"></script>
<script src="js/fileio.js?v=sc33"></script>
<script src="js/xml.js?v=sc33"></script>
<script src="js/ui.js?v=sc33"></script>
<script src="js/notate.js?v=sc33"></script>
<script src="js/menu.js?v=sc33"></script>
<script src="js/main.js?v=sc33"></script>
<script src="../pwa.js" defer></script>
<script src="../ping.js" defer></script>
</body>
</html>
