/* conversations are kept only in this browser (localStorage), newest first */
var CK='ffchat.convs.v1', CAP=30, conv=null, gen=0;   // gen changes whenever the open conversation changes, so a late answer never lands in another one

function convPut(){ if(!conv) return; var l=convLoad().filter(function(c){ return c.id!==conv.id; }); conv.t=Date.now(); l.unshift(conv); convSave(l); }
function convPush(r,text){
  if(!conv){ conv={id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), model:cur.id, title:String(text).replace(/\s+/g,' ').slice(0,28), t:Date.now(), msgs:[]}; }
  conv.msgs.push({r:r,x:String(text).slice(0,6000)}); if(conv.msgs.length>80) conv.msgs=conv.msgs.slice(-80);
  convPut(); }
function convDel(id){ convSave(convLoad().filter(function(c){ return c.id!==id; })); renderRecent(); }
function renderRecent(){
  var l=convLoad(), ul=$('rl'); ul.innerHTML=''; $('recent').hidden=!l.length;
  l.forEach(function(c){
    var li=document.createElement('li'), go=document.createElement('button'); go.type='button'; go.className='go'; go.setAttribute('data-notr','');
    var b=document.createElement('b'); b.textContent=c.title||'…'; var sm=document.createElement('small');
    var m=models.filter(function(x){ return x.id===c.model; })[0]; var d=new Date(c.t);
    sm.textContent=((m?String(m.name).split(' ').pop():c.model)+' · '+d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+Math.ceil(c.msgs.length/2));
    go.appendChild(b); go.appendChild(sm); go.onclick=function(){ if(m) choose(m,c); };
    if(!m||!m.ready) go.disabled=true;
    var del=document.createElement('button'); del.type='button'; del.className='del'; del.textContent=T('삭제'); var armed=0;
    del.onclick=function(){ if(armed){ convDel(c.id); return; } armed=1; del.textContent=T('정말 지울까요?'); setTimeout(function(){ armed=0; del.textContent=T('삭제'); },3000); };
    li.appendChild(go); li.appendChild(del); ul.appendChild(li);
  });
}
function seen(id){ try{ return localStorage.getItem('ffchat.dl.'+id)==='1'; }catch(e){ return false; } }
function markSeen(id){ try{ localStorage.setItem('ffchat.dl.'+id,'1'); }catch(e){} }
function ask(text){
  return new Promise(function(res){
    var o=document.createElement('div'); o.className='ov'; o.setAttribute('data-notr','');
    o.innerHTML='<div class="dlg" role="dialog" aria-modal="true"><p></p><div class="acts"><button class="ghost" type="button"></button><button class="btn" type="button"></button></div></div>';
    o.querySelector('p').textContent=text; var b=o.querySelectorAll('button'); b[0].textContent=T('취소'); b[1].textContent=T('내려받고 시작');
    function done(v){ o.remove(); res(v); }
    b[0].onclick=function(){ done(false); }; b[1].onclick=function(){ done(true); };
    o.onkeydown=function(e){ if(e.key==='Escape') done(false); };
    document.body.appendChild(o); b[1].focus();
  });
}
function renderModels(){
  var box=$('models'); box.innerHTML='';
  models.forEach(function(m){
    var b=document.createElement('button'); b.type='button'; b.className='mc'; b.disabled=!m.ready; b.setAttribute('data-id',m.id);
    var ic=document.createElement('span'); ic.className='ico'; ic.textContent=ICON[m.id]||'✦'; ic.setAttribute('aria-hidden','true'); b.appendChild(ic);
    var n=document.createElement('span'); n.className='n'; n.setAttribute('data-notr',''); var nm=String(m.name).replace(/^FF777\s*/,'').split(' '); n.textContent=nm[nm.length-1]; var v=document.createElement('small'); v.textContent=nm.slice(0,-1).join(' '); n.appendChild(v);
    var d=document.createElement('span'); d.className='d'; d.textContent=T(DESC[m.id]||'')+(EXTRA[m.id]?' · '+T(EXTRA[m.id]):'');
    var s=document.createElement('span'); s.className='s'; s.setAttribute('data-notr',''); s.textContent=m.ready?m.size:T('준비 중');
    b.appendChild(n); b.appendChild(d); b.appendChild(s);
    b.onclick=function(){ choose(m); };
    box.appendChild(b);
  });
  renderRecent();
}
function choose(m,c){
  if(!m.ready) return;
  var go=seen(m.id)?Promise.resolve(true):ask(T('처음 한 번만 {0} 크기의 파일을 내려받아요. 와이파이에서 쓰는 걸 추천해요. 계속할까요?').replace('{0}',m.size));
  go.then(function(ok){
    if(!ok) return;
    markSeen(m.id); gen++; cur=m; hist=[]; conv=c||null; $('cur').textContent=m.name; $('chat').style.setProperty('--ac',ACC[m.id]||'#ffc93c'); $('chips').hidden=!!(c&&c.msgs.length); greet();
    if(c) restore(c);
    $('pick').hidden=true; $('hero').hidden=true; $('chat').hidden=false; $('q').focus();
  });
}
function add(cls,text){
  var hi=$('log').querySelector('.hi'); if(hi) hi.remove();
  var row=document.createElement('div'); row.className='row '+cls;
  if(cls==='a'){ var av=document.createElement('span'); av.className='av'; av.setAttribute('aria-hidden','true'); av.textContent='🍟'; row.appendChild(av); }
  var d=document.createElement('div'); d.className='m '+cls; d.setAttribute('data-notr',''); d.textContent=text; row.appendChild(d);
  $('log').appendChild(row); $('log').scrollTop=$('log').scrollHeight; return d; }
function greet(){
  $('log').innerHTML=''; var h=document.createElement('div'); h.className='hi'; h.setAttribute('data-notr','');
  h.innerHTML='<img src="../logo.svg" alt="" width="64" height="64"><b></b><span></span>'; h.querySelector('b').textContent=cur?cur.name:''; h.querySelector('span').textContent=T('궁금한 걸 물어보세요');
  $('log').appendChild(h); }
function restore(c){
  var lastQ='';
  c.msgs.forEach(function(m){
    if(m.r==='u'){ add('u',m.x); lastQ=m.x; hist.push({role:'user',content:m.x}); }
    else{ var d=add('a',m.x); hist.push({role:'assistant',content:m.x}); FFWrong.attach(d,{tool:'ai-chat',question:lastQ,answer:m.x,model:'local:'+cur.id}); }
  });
  while(hist.length&&hist[hist.length-1].role==='user') hist.pop();   // a question that never got an answer is not part of the memory
  $('log').scrollTop=$('log').scrollHeight;
}
function dots(d){ d.innerHTML='<span class="dots" aria-label="…"><i></i><i></i><i></i></span>'; }
function trim(){ var n=0, i=hist.length; while(i>0){ n+=hist[i-1].content.length; if(n>1500) break; i--; } hist=hist.slice(i); if(hist.length&&hist[0].role==='assistant') hist.shift(); }
function setBusy(b){ busy=b; $('send').textContent=T(b?'멈추기':'보내기'); $('send').type=b?'button':'submit'; }
function send(q){
  q=String(q||'').trim(); if(!q||busy||!cur) return;
  $('q').value=''; $('chips').hidden=true; add('u',q); convPush('u',q);
  var out=add('a',''), got='', g=gen, mid=cur.id; dots(out); setBusy(true);
  trim();
  FFAI.ask({model:cur.id, prose:true, chat:true, maxTokens:LEN[lv].tok, facts:true, question:q, history:hist.slice(), system:chatSys(), prompt:q,
    onText:function(t){ got=t; out.textContent=t; $('log').scrollTop=$('log').scrollHeight; }}).then(function(r){
    var a=String(typeof r==='string'?r:(r&&r.text)||got||'').trim();
    out.textContent=a||T('답하지 못했어요');
    if(a){ if(g===gen){ hist.push({role:'user',content:q},{role:'assistant',content:a}); convPush('a',a); } FFWrong.attach(out,{tool:'ai-chat',question:q,answer:a,model:'local:'+cur.id}); }
    else out.classList.add('bad');
  },function(e){
    if(got){ out.textContent=got; if(g===gen){ convPush('a',got); hist.push({role:'user',content:q},{role:'assistant',content:got}); } return; }
    out.classList.add('bad'); out.textContent=(e&&e.message)||T('답하지 못했어요');
  }).then(function(){ setBusy(false); });
}
$('form').onsubmit=function(e){ e.preventDefault(); send($('q').value); };
$('send').onclick=function(){ if(busy){ FFAI.stop(); } };
$('q').onkeydown=function(e){ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); if(!busy) send($('q').value); } };
Array.prototype.forEach.call(document.querySelectorAll('#len button'),function(b){ b.onclick=function(){ lv=+b.dataset.l; try{ localStorage.setItem('ffchat.len',String(lv)); }catch(e){} showLen(); }; });
showLen();
$('clear').onclick=function(){ if(busy) FFAI.stop(); gen++; hist=[]; conv=null; greet(); $('chips').hidden=false; };
$('change').onclick=function(){ if(busy) FFAI.stop(); gen++; cur=null; hist=[]; conv=null; renderRecent(); $('chat').hidden=true; $('pick').hidden=false; $('hero').hidden=false; };
['너는 누구야?','파이썬이 뭐야?','광합성을 쉽게 설명해 줘'].forEach(function(t){
  var b=document.createElement('button'); b.type='button'; b.textContent=T(t); b.onclick=function(){ send(T(t)); }; $('chips').appendChild(b);
});
function showLoginHint(){ $('loginHint').hidden=!(window.FFAuth&&FFAuth.user&&FFAuth.user()); }
if(window.FFAuth){ FFAuth.ready.then(function(){ showLoginHint(); FFAuth.onChange(showLoginHint); },function(){}); }
var tuned=FFAI.models().filter(function(m){ return /^FF-/.test(m.id); });
models=tuned.map(function(m){ return {id:m.id, name:m.name, size:m.size, ready:false}; });
renderModels();
FFAI.gpu().then(function(ok){
  if(!ok){ $('gpuErr').hidden=false; return; }
  models.forEach(function(m){ FFAI.tunedReady(m.id).then(function(r){ m.ready=!!r; renderModels(); }); });
});
})();
</script>
<script src="../pwa.js" defer></script>
