<style>
:root{ --bg:#08090d; --panel:#10131b; --panel2:#151925; --line:#222837; --text:#eef0f5; --dim:#8a93a6; --fry:#ffc93c; --fry2:#ff8a3d; --desk:#0b0d13; }
html[data-ff-theme=light]{ --bg:#f6f3ec; --panel:#ffffff; --panel2:#f1ede4; --line:#e2dccf; --text:#1f1b14; --dim:#6d6658; --desk:#e6e1d6; }
*{box-sizing:border-box;}
html,body{margin:0; height:100%; background:var(--bg); color:var(--text); overscroll-behavior:none;}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; font-size:14px; display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0); -webkit-tap-highlight-color:transparent;}
button,input,select,textarea{font:inherit; color:inherit;}
[hidden]{display:none!important;}
.top{display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); flex:0 0 auto;}
.home{display:grid; place-items:center; width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--fry),var(--fry2)); text-decoration:none; font-size:18px; flex:0 0 auto;}
.brand{font-family:'Oswald',sans-serif; font-weight:700; font-size:18px; letter-spacing:.04em; white-space:nowrap;}
.brand b{color:var(--fry);}
#docName{flex:1 1 120px; min-width:60px; max-width:320px; background:transparent; border:1px solid transparent; border-radius:8px; padding:6px 8px; font-size:15px; font-weight:500;}
#docName:hover,#docName:focus{border-color:var(--line); background:var(--bg); outline:none;}
.saved{color:var(--dim); font-size:12px; white-space:nowrap;}
.sp{flex:1;}
.tbtn{display:inline-flex; align-items:center; justify-content:center; gap:6px; height:34px; padding:0 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; white-space:nowrap;}
.tbtn:hover:not(:disabled){border-color:#3a4256;} .tbtn:disabled{opacity:.4; cursor:default;}
.tbtn.pri{background:linear-gradient(90deg,var(--fry),var(--fry2)); color:#1c1405; border:0; font-weight:700;}
.tbtn.aib{border-color:#5a4a1c; color:var(--fry);}
.tbtn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto;}
.langSel{background:var(--panel2); color:var(--dim); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13px;}
@media(max-width:1100px){ .saved{display:none;} }
@media(max-width:960px){ .brand{display:none;} .top{gap:6px;} #docName{flex-basis:70px;} .langSel{max-width:96px;} }
.top{overflow-x:auto; scrollbar-width:none;} .top::-webkit-scrollbar{display:none;} .top>*{flex-shrink:0;} .top #docName{flex-shrink:1;}
@media(max-width:700px){ .tbtn .lb{display:none;} #docName{max-width:none;} .langSel{max-width:84px;} .top{padding:6px 8px;} }
/* toolbar */
.bar{flex:0 0 auto; display:flex; align-items:center; gap:2px; padding:5px 8px; background:var(--panel); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
.bar::-webkit-scrollbar{display:none;}
.ib{flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; gap:4px; min-width:36px; height:36px; padding:0 7px; border-radius:8px; border:1px solid transparent; background:transparent; cursor:pointer; font-size:15px; white-space:nowrap;}
.ib:hover:not(:disabled){background:var(--panel2); border-color:var(--line);}
.ib:disabled{opacity:.35; cursor:default;}
.ib.on{background:rgba(255,201,60,.13); border-color:rgba(255,201,60,.45); color:var(--fry);}
.ib svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.ib .lb{font-size:13px;}
.sep{flex:0 0 1px; align-self:stretch; margin:5px 4px; background:var(--line);}
#blockSel{height:34px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); padding:0 6px; font-size:13.5px; cursor:pointer; flex:0 0 auto;}
.colorB{position:relative;} .colorB i{position:absolute; left:9px; right:9px; bottom:5px; height:4px; border-radius:2px; background:#e03131;}
.colorB input{position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;}
.ctx{display:flex; align-items:center; gap:2px; flex:0 0 auto;} .ctx b{font-size:12px; color:var(--dim); margin:0 4px 0 2px; font-weight:500;}
/* page */
#desk{flex:1; overflow:auto; background:var(--desk); padding:28px 16px 80px; -webkit-overflow-scrolling:touch;}
#page{width:794px; max-width:100%; min-height:1123px; margin:0 auto; background:#fff; color:#1b1b1b; box-shadow:0 4px 24px rgba(0,0,0,.35); padding:96px; outline:none;
  font-family:'Noto Sans KR','Malgun Gothic',sans-serif; font-size:15px; line-height:1.7; word-break:keep-all; overflow-wrap:break-word; caret-color:#1b1b1b;}
#page.serif{font-family:'Noto Serif KR','Batang',serif;}
#page:empty::before{content:attr(data-ph); color:#9a9a9a;}
#page p{margin:0 0 .55em;} #page h1{font-size:28px; margin:.6em 0 .35em; line-height:1.3;} #page h2{font-size:22px; margin:.6em 0 .3em; line-height:1.35;} #page h3{font-size:18px; margin:.5em 0 .3em;}
#page h1:first-child,#page h2:first-child,#page h3:first-child{margin-top:0;}
#page blockquote{margin:.4em 0 .7em; padding:.2em 0 .2em 1em; border-left:4px solid #c9c9c9; color:#555; font-style:italic;}
#page ul,#page ol{margin:0 0 .6em; padding-left:1.6em;}
#page table{border-collapse:collapse; width:100%; margin:.4em 0 .8em; table-layout:fixed;}
#page td,#page th{border:1px solid #9a9a9a; padding:6px 8px; vertical-align:top; min-width:30px;}
#page th{background:#f2f2f2;}
#page hr{border:0; border-top:1px solid #9a9a9a; margin:1em 0;}
#page img{max-width:100%; height:auto; vertical-align:bottom; cursor:pointer;}
#page img.sel{outline:3px solid #ffb000; outline-offset:2px;}
@media(max-width:840px){ #desk{padding:12px 8px 60px;} #page{padding:36px 24px; min-height:70vh;} }
.foot{flex:0 0 auto; display:flex; gap:14px; align-items:center; padding:5px 14px; background:var(--panel); border-top:1px solid var(--line); color:var(--dim); font-size:12.5px;}
/* menus and dialogs */
.menu{position:fixed; z-index:60; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px; min-width:210px; box-shadow:0 20px 50px rgba(0,0,0,.55); display:none; max-height:80vh; overflow:auto;}
.menu.open{display:block;}
.menu button{display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px; border:0; background:transparent; border-radius:8px; cursor:pointer; text-align:left; white-space:nowrap;}
.menu button:hover:not(:disabled){background:var(--panel2);}
.menu hr{border:0; border-top:1px solid var(--line); margin:6px 4px;}
.menu .mh{color:var(--dim); font-size:12px; padding:6px 12px 2px;}
.ov{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:80; display:none; align-items:center; justify-content:center; padding:12px;}
.ov.open{display:flex;}
.dlg{background:var(--panel); border:1px solid var(--line); border-radius:16px; width:min(520px,100%); max-height:94vh; display:flex; flex-direction:column; box-shadow:0 30px 80px rgba(0,0,0,.6);}
.dh{display:flex; align-items:center; gap:8px; padding:10px 12px 10px 16px; border-bottom:1px solid var(--line);}
.dh h3{margin:0; font-size:16px; flex:1;}
.x{width:36px; height:36px; border:0; background:transparent; color:var(--dim); font-size:24px; cursor:pointer; border-radius:8px;}
.x:hover{background:var(--panel2); color:var(--text);}
.dbody{padding:14px 16px; display:flex; flex-direction:column; gap:8px; overflow:auto;}
.dbody p{margin:0; color:var(--dim); font-size:13.5px; line-height:1.55;}
.dfoot{display:flex; gap:8px; justify-content:flex-end; padding:10px 16px; border-top:1px solid var(--line); flex-wrap:wrap;}
.num2{display:grid; grid-template-columns:1fr 1fr; gap:10px;} .num2 label{display:flex; flex-direction:column; gap:4px; color:var(--dim); font-size:13px;}
.num2 input{height:40px; border-radius:9px; border:1px solid var(--line); background:var(--bg); padding:0 10px; font-size:16px;}
.docs{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px;}
.docs li{display:flex; align-items:center; gap:6px; padding:6px 6px 6px 10px; border:1px solid var(--line); border-radius:10px;}
.docs li.on{border-color:var(--fry);}
.docs .dn{flex:1; min-width:0; display:flex; flex-direction:column; cursor:pointer;} .docs .dn b{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;} .docs .dn small{color:var(--dim); font-size:12px;}
.docs input{flex:1; min-width:0; height:34px; border-radius:8px; border:1px solid var(--fry); background:var(--bg); padding:0 8px;}
.docs .ib{min-width:34px; height:34px;}
#aiOut{white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-height:90px; max-height:50vh; overflow:auto; font-size:14.5px; line-height:1.6;}
.aiWarn{color:var(--dim); font-size:12.5px;}
#toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:#1d2230; color:#eef0f5; border:1px solid var(--line); padding:9px 16px; border-radius:99px; z-index:300; opacity:0; transition:opacity .2s; pointer-events:none; max-width:92vw; text-align:center;}
#toast.on{opacity:1;}
@media print{
  @page{size:A4; margin:20mm;}
  html,body{height:auto; overflow:visible; background:#fff; display:block; padding:0;}
  body>*:not(#desk){display:none!important;}
  #desk{overflow:visible; padding:0; background:#fff;}
  #page{box-shadow:none; padding:0; width:auto; min-height:0; max-width:none;}
  #page img.sel{outline:0;}
}
</style>
</head>
