<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="copyright" content="© 2026 Frenchfries777. CC BY-NC-ND 4.0 (https://creativecommons.org/licenses/by-nc-nd/4.0/)">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body,*{touch-action:manipulation}</style>
<title>Fry Python · Frenchfries777 Tools</title>
<meta name="description" content="설치 없이 브라우저에서 파이썬을 실행해요. 거북이 그림과 그래프를 그리고, 오류가 나면 AI가 쉽게 설명해 줘요.">
<meta name="theme-color" content="#08090d">
<link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="../i18n.js"></script>
<style>
:root{ --bg:#08090d; --panel:#10131b; --panel2:#151925; --line:#222837; --text:#eef0f5; --dim:#8a93a6; --fry:#ffc93c; --fry2:#ff8a3d; --code:#0c0e14; --py:#4b8bbe;
  --k:#ff7ab2; --s:#a5e075; --c:#6c7a92; --n:#ffb86b; --f:#6cc6ff; --b:#c99bff; }
html[data-ff-theme=light]{ --bg:#f6f3ec; --panel:#ffffff; --panel2:#f1ede4; --line:#e2dccf; --text:#1f1b14; --dim:#6d6658; --code:#fffdf8;
  --k:#c41a67; --s:#2d7d1a; --c:#8a8f99; --n:#b45309; --f:#0b6fb0; --b:#7c3aed; }
*{box-sizing:border-box;}
html,body{margin:0; height:100%; background:var(--bg); color:var(--text); overscroll-behavior:none;}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; font-size:14px; display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0); -webkit-tap-highlight-color:transparent;}
button,input,select,textarea{font:inherit; color:inherit;}
[hidden]{display:none!important;}
.top{display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); flex:0 0 auto; overflow-x:auto; scrollbar-width:none;}
.top::-webkit-scrollbar{display:none;} .top>*{flex-shrink:0;}
.home{display:grid; place-items:center; width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--fry),var(--fry2)); text-decoration:none; font-size:18px;}
.brand{font-family:'Oswald',sans-serif; font-weight:700; font-size:18px; letter-spacing:.04em; white-space:nowrap;}
.brand b{color:var(--fry);}
#fileName{flex:1 1 120px; flex-shrink:1; min-width:60px; max-width:280px; background:transparent; border:1px solid transparent; border-radius:8px; padding:6px 8px; font-size:15px; font-weight:500;}
#fileName:hover,#fileName:focus{border-color:var(--line); background:var(--bg); outline:none;}
.saved{color:var(--dim); font-size:12px; white-space:nowrap;}
.sp{flex:1;}
.tbtn{display:inline-flex; align-items:center; justify-content:center; gap:6px; height:34px; padding:0 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; white-space:nowrap;}
.tbtn:hover:not(:disabled){border-color:#3a4256;} .tbtn:disabled{opacity:.4; cursor:default;}
.tbtn.pri{background:linear-gradient(90deg,var(--fry),var(--fry2)); color:#1c1405; border:0; font-weight:700;}
.tbtn.run{background:#2fb36d; color:#04170c; border:0; font-weight:700; padding:0 16px;}
.tbtn.stop{background:#e5534b; color:#fff; border:0; font-weight:700;}
.tbtn.aib{border-color:#5a4a1c; color:var(--fry);}
.tbtn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto;}
.tbtn.run svg,.tbtn.stop svg{fill:currentColor; stroke:none;}
.langSel{background:var(--panel2); color:var(--dim); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13px;}
@media(max-width:1100px){ .saved{display:none;} }
@media(max-width:960px){ .brand{display:none;} .top{gap:6px;} .langSel{max-width:96px;} }
@media(max-width:700px){ .tbtn .lb{display:none;} .top{padding:6px 8px;} .tbtn.run .lb{display:inline;} }
/* layout */
.main{flex:1; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); min-height:0;}
@media(max-width:860px){ .main{grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) minmax(0,1fr);} }
.pane{display:flex; flex-direction:column; min-height:0; min-width:0;}
.pane+.pane{border-left:1px solid var(--line);}
@media(max-width:860px){ .pane+.pane{border-left:0; border-top:1px solid var(--line);} }
.ph{flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--line); font-size:12.5px; color:var(--dim);}
.ph b{color:var(--text); font-weight:600; font-size:13px;}
/* editor */
.ed{position:relative; flex:1; display:flex; min-height:0; background:var(--code); overflow:hidden;}
.gut{flex:0 0 auto; padding:12px 8px 12px 10px; text-align:right; color:var(--c); font:13.5px/1.6 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; user-select:none; overflow:hidden; min-width:44px; border-right:1px solid var(--line);}
.gut div{height:1.6em;} .gut .bad{color:#fff; background:#e5534b; border-radius:4px; padding:0 4px; margin-right:-4px;}
.cw{position:relative; flex:1; min-width:0; overflow:hidden;}
#hl,#code{position:absolute; inset:0; margin:0; padding:12px 14px; font:13.5px/1.6 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; tab-size:4; white-space:pre; overflow:auto; border:0; letter-spacing:0; word-spacing:0;}
#hl{pointer-events:none; color:var(--text); overflow:hidden;}
#code{background:transparent; color:transparent; caret-color:var(--text); resize:none; outline:none; -webkit-text-fill-color:transparent;}
#code::selection{background:rgba(110,150,255,.35);}
#hl .k{color:var(--k);} #hl .s{color:var(--s);} #hl .c{color:var(--c); font-style:italic;} #hl .n{color:var(--n);} #hl .f{color:var(--f);} #hl .b{color:var(--b);}
#hl .eline{background:rgba(229,83,75,.18); display:inline-block; min-width:100%;}
/* output */
#out{flex:1; overflow:auto; padding:10px 12px 24px; background:var(--code); font:13.5px/1.55 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; -webkit-overflow-scrolling:touch;}
#out pre{margin:0; white-space:pre-wrap; word-break:break-word;}
#out .err{color:#ff8b84;}
#out .sys{color:var(--dim); font-family:'Noto Sans KR',sans-serif; font-size:12.5px; margin:6px 0;}
#out .ok{color:#5fd39a;}
#out canvas{display:block; max-width:100%; height:auto; margin:10px 0; border-radius:10px; border:1px solid var(--line); background:#fff;}
.why{display:flex; flex-direction:column; gap:8px; margin:10px 0; padding:10px 12px; border:1px solid #5a4a1c; border-radius:10px; background:rgba(255,201,60,.06); font-family:'Noto Sans KR',sans-serif;}
.why .tbtn{align-self:flex-start;}
.why .ans{white-space:pre-wrap; line-height:1.6; font-size:14px;}
.why small{color:var(--dim);}
.stdin{flex:0 0 auto; border-top:1px solid var(--line); background:var(--panel);}
.stdin summary{cursor:pointer; padding:7px 12px; font-size:12.5px; color:var(--dim); list-style:none;}
.stdin summary::-webkit-details-marker{display:none;}
.stdin summary b{color:var(--text); font-weight:600;}
#stdin{display:block; width:calc(100% - 20px); margin:0 10px 10px; min-height:62px; max-height:150px; resize:vertical; background:var(--code); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:13px/1.5 'JetBrains Mono',monospace;}
#stdin:focus{outline:none; border-color:var(--fry);}
.spin{width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--fry); border-radius:50%; animation:sp 1s linear infinite; display:inline-block; vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg);}}
/* menus and dialogs */
.menu{position:fixed; z-index:60; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px; min-width:220px; box-shadow:0 20px 50px rgba(0,0,0,.55); display:none; max-height:80vh; overflow:auto;}
.menu.open{display:block;}
.menu button{display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px; border:0; background:transparent; border-radius:8px; cursor:pointer; text-align:left; white-space:nowrap;}
.menu button:hover{background:var(--panel2);}
.menu hr{border:0; border-top:1px solid var(--line); margin:6px 4px;}
.menu .mh{color:var(--dim); font-size:12px; padding:6px 12px 2px;}
.ov{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:80; display:none; align-items:center; justify-content:center; padding:12px;}
.ov.open{display:flex;}
.dlg{background:var(--panel); border:1px solid var(--line); border-radius:16px; width:min(540px,100%); max-height:94vh; display:flex; flex-direction:column; box-shadow:0 30px 80px rgba(0,0,0,.6);}
.dh{display:flex; align-items:center; gap:8px; padding:10px 12px 10px 16px; border-bottom:1px solid var(--line);}
.dh h3{margin:0; font-size:16px; flex:1;}
.x{width:36px; height:36px; border:0; background:transparent; color:var(--dim); font-size:24px; cursor:pointer; border-radius:8px;}
.x:hover{background:var(--panel2); color:var(--text);}
.dbody{padding:14px 16px; overflow:auto;}
.dfoot{display:flex; gap:8px; justify-content:flex-end; padding:10px 16px; border-top:1px solid var(--line);}
.files{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px;}
.files li{display:flex; align-items:center; gap:6px; padding:6px 6px 6px 10px; border:1px solid var(--line); border-radius:10px;}
.files li.on{border-color:var(--fry);}
.files .dn{flex:1; min-width:0; display:flex; flex-direction:column; cursor:pointer;} .files .dn b{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;} .files .dn small{color:var(--dim); font-size:12px;}
.files input{flex:1; min-width:0; height:34px; border-radius:8px; border:1px solid var(--fry); background:var(--bg); padding:0 8px;}
.ib{min-width:34px; height:34px; border-radius:8px; border:1px solid transparent; background:transparent; cursor:pointer;}
.ib:hover{background:var(--panel2); border-color:var(--line);}
#toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:#1d2230; color:#eef0f5; border:1px solid var(--line); padding:9px 16px; border-radius:99px; z-index:300; opacity:0; transition:opacity .2s; pointer-events:none; max-width:92vw; text-align:center;}
#toast.on{opacity:1;}
/* auto-complete and dictionary */
#ac{position:fixed; z-index:90; min-width:260px; max-width:min(420px,92vw); background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 40px rgba(0,0,0,.5); padding:4px; font-size:13px;}
#ac[hidden]{display:none;}
.aci{display:flex; gap:10px; align-items:baseline; padding:5px 9px; border-radius:7px; cursor:pointer;}
.aci b{font:600 13px 'JetBrains Mono',monospace; flex:0 0 auto; color:var(--f);} .aci span{color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.aci.on{background:var(--panel2); box-shadow:inset 0 0 0 1px var(--fry);}
.ach{padding:4px 9px 2px; color:var(--dim); font-size:11.5px; border-top:1px solid var(--line); margin-top:3px;}
#mir{pointer-events:none;}
.dsearch{padding:10px 16px 4px;} .dsearch input{width:100%; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--bg); padding:0 12px; font-size:15px;} .dsearch input:focus{outline:none; border-color:var(--fry);}
.dcats{display:flex; gap:6px; flex-wrap:wrap; padding:8px 16px;} .dcats button{border:1px solid var(--line); background:var(--panel2); border-radius:99px; padding:4px 12px; cursor:pointer; font-size:13px;} .dcats button.on{border-color:var(--fry); color:var(--fry);}
.dlist{flex:1; overflow:auto; padding:0 12px 8px; display:flex; flex-direction:column; gap:4px; -webkit-overflow-scrolling:touch;}
.drow{display:grid; grid-template-columns:minmax(120px,190px) 1fr; gap:2px 12px; text-align:left; border:1px solid var(--line); border-radius:10px; background:transparent; padding:8px 10px; cursor:pointer;}
.drow:hover{border-color:var(--fry); background:var(--panel2);} .drow code{font:600 13px 'JetBrains Mono',monospace; color:var(--f); word-break:break-all;} .drow span{font-size:13.5px;}
.drow pre{grid-column:1/-1; margin:2px 0 0; font:12px/1.5 'JetBrains Mono',monospace; color:var(--dim); white-space:pre-wrap;}
.dlist .none{color:var(--dim); text-align:center; padding:20px;}
@media(max-width:560px){ .drow{grid-template-columns:1fr;} }
</style>
</head>
<body>
<header class="top">
  <a class="home" href="../" aria-label="도구 목록">🍟</a>
  <span class="brand" data-notr>FRY <b>PYTHON</b></span>
  <input id="fileName" aria-label="파일 이름" spellcheck="false" autocomplete="off" data-notr>
  <span class="saved" id="saved"></span>
  <span class="sp"></span>
  <button class="tbtn run" id="runBtn" type="button" title="실행 (Ctrl+Enter)"><svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg><span class="lb">실행</span></button>
  <button class="tbtn stop" id="stopBtn" type="button" hidden><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span class="lb">멈추기</span></button>
  <button class="tbtn" id="exBtn" type="button"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg><span class="lb">예제</span></button>
  <button class="tbtn" id="dictBtn" type="button" title="파이썬 명령어 사전"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21a2 2 0 0 1 2-2h13"/><path d="M9 8h6M9 12h4"/></svg><span class="lb">사전</span></button>
  <button class="tbtn" id="mineBtn" type="button"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg><span class="lb">내 파일</span></button>
  <button class="tbtn" id="verBtn" type="button" title="저장해 둔 예전 버전으로 되돌려요"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg><span class="lb">버전</span></button>
  <button class="tbtn" id="fileBtn" type="button"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="lb">파일</span></button>
  <span data-lang-slot></span>
</header>
<div class="main">
  <section class="pane">
    <div class="ph"><b>코드</b><span class="sp"></span><span id="pos" data-notr></span></div>
    <div class="ed"><div class="gut" id="gut" aria-hidden="true"></div><div class="cw"><pre id="hl" aria-hidden="true" data-notr></pre><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="파이썬 코드" data-notr></textarea></div></div>
  </section>
  <section class="pane">
    <div class="ph"><b>결과</b><span id="state"></span><span class="sp"></span><button class="tbtn" id="clearBtn" type="button" style="height:28px;padding:0 10px;font-size:12.5px">지우기</button></div>
    <div id="out" data-notr></div>
    <details class="stdin" id="stdinBox"><summary><b>입력값</b> · input()에 한 줄씩 차례로 들어가요</summary><textarea id="stdin" spellcheck="false" data-notr placeholder="예: 철수&#10;12"></textarea></details>
  </section>
</div>
<div class="menu" id="exMenu"></div>
<div class="menu" id="fileMenu">
  <button data-f="open">📂 .py 파일 열기</button>
  <button data-f="save">💾 .py 파일로 받기</button>
  <hr>
  <button data-f="ai">⚙️ AI 설정</button>
</div>
<div class="ov" id="mgrDlg"><div class="dlg">
  <div class="dh"><h3>내 파일</h3><button class="x" data-close aria-label="닫기">×</button></div>
  <div class="dbody"><ul class="files" id="fileList"></ul></div>
  <div class="dfoot"><button class="tbtn pri" id="newBtn">+ 새 파일</button></div>
</div></div>
<div class="ov" id="dictDlg"><div class="dlg" style="width:min(680px,100%); height:min(86vh,720px)">
  <div class="dh"><h3>명령어 사전</h3><button class="x" data-close aria-label="닫기">×</button></div>
  <div class="dsearch"><input id="dictQ" type="search" placeholder="명령어나 뜻으로 찾기 (예: 반복, 원, forward)" autocomplete="off" spellcheck="false" data-notr></div>
  <div class="dcats" id="dictCats"></div>
  <div class="dlist" id="dictList"></div>
  <div class="dfoot" style="justify-content:flex-start"><span style="color:var(--dim);font-size:12.5px">누르면 코드 칸의 커서 자리에 넣어요</span></div>
</div></div>
<input type="file" id="openFile" accept=".py,.txt" hidden>
<div id="toast" role="status"></div>
<script src="../ai.js?v=ai30.l13"></script>
<script src="../ai-prompts.js"></script>
<script src="../versions.js?v=1"></script>
<script src="../undotoast.js"></script>
<script src="strings.js?v=p3"></script>
<script src="examples.js?v=p3"></script>
<script src="dict.js?v=p3"></script>
<script src="app.js?v=p3"></script>
<script src="../pwa.js" defer></script>
<script src="../ping.js" defer></script>
</body>
</html>
