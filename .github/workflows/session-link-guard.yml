name: session-link-guard

# Removes claude.ai session links from PR titles/bodies, then fails the
# "no-session-link" check if a session link is still present in the PR title,
# body or any commit message of the PR.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const URL_RE = /https?:\/\/claude\.ai\/code\/session_[0-9A-Za-z]+/g;
            const has = (t) => /claude\.ai\/code\/session_/.test(t || '');
            const clean = (t) => {
              const out = [];
              for (const line of (t || '').split('\n')) {
                if (has(line)) {
                  let rest = line.replace(URL_RE, '');
                  rest = rest.replace(/_?Generated by \[Claude Code\]\(\)_?/g, '');
                  rest = rest.replace(/^\s*(Claude-Session:)?\s*$/, '');
                  if (rest.trim() === '') continue;
                  out.push(rest.replace(/\s+$/, ''));
                } else {
                  out.push(line);
                }
              }
              let m = out.join('\n').replace(/\s+$/, '');
              m = m.replace(/(\n+---\s*)+$/, '');
              return m;
            };
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number });
            const update = {};
            if (has(pr.body)) update.body = clean(pr.body);
            if (has(pr.title)) update.title = clean(pr.title).replace(/\n/g, ' ');
            if (Object.keys(update).length) {
              await github.rest.pulls.update({ ...context.repo, pull_number: pr.number, ...update });
              core.info('Removed session link from: ' + Object.keys(update).join(', '));
            }

  no-session-link:
    needs: strip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const has = (t) => /claude\.ai\/code\/session_/.test(t || '');
            const number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            const bad = [];
            if (has(pr.title)) bad.push('PR title');
            if (has(pr.body)) bad.push('PR body');
            const commits = await github.paginate(github.rest.pulls.listCommits, { ...context.repo, pull_number: number, per_page: 100 });
            for (const c of commits) {
              if (has(c.commit.message)) bad.push('commit ' + c.sha.slice(0, 7));
            }
            if (bad.length) {
              core.setFailed('Session link found in: ' + bad.join(', ') + '. Remove the Claude-Session line / claude.ai/code/session_ link (amend or rebase the commits) and push again.');
            }
