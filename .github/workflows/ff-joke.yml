# Runs a merged FF777 model (Hugging Face, CPU) on the owner's 115 dad jokes and lists every riddle whose answer is not its
# own punchline (train/ff_joke.py, train/ff_joke_sum.py). Needs the repository secret HF_TOKEN. Run it from the Actions tab.
name: Check FF777 dad jokes

on:
  workflow_dispatch:
    inputs:
      model:
        description: Hugging Face model (merged weights)
        default: Frenchfries777/FF-Tools-4B-merged-1.5
      shards:
        description: Number of parallel jobs (1-14)
        default: '10'
      max_new_tokens:
        description: Longest answer in tokens
        default: '64'
      site:
        description: Ask the "chat" way the site does (the model's own name text in the system prompt, sampling) instead of the plain chat prompt
        default: 'false'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.l.outputs.list }}
    steps:
      - id: l
        run: python3 -c "import json;n=int('${{ inputs.shards }}');print('list='+json.dumps(list(range(n))))" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q transformers accelerate sentencepiece safetensors huggingface_hub
      - name: Run
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FF_SITE: ${{ inputs.site == 'true' && '1' || '0' }}
        run: python -u train/ff_joke.py "${{ inputs.model }}" ${{ matrix.shard }} "${{ inputs.shards }}" "${{ inputs.max_new_tokens }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jokes-${{ matrix.shard }}
          path: out
  sum:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: answers
      - run: python3 train/ff_joke_sum.py answers
