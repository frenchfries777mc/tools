# Judges the answers of a finished "Try FF777 on examples" run that used train/eval/edit-requests.json, in a real Chromium
# (train/ff_check_edit.js), and prints the table (and each answer's diff against its base page) in the log.
name: Check FF777 edit answers

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id of the finished "Try FF777 on examples" run
        required: true

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Download answers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.run_id }}" --repo "${{ github.repository }}" --dir answers
      - run: node train/ff_check_edit.js answers --diff
