# Runs the real FF777 model (Hugging Face merged weights, CPU) on the Block HTML example requests and prints the answers
# in the log. Needs the repository secret HF_TOKEN (the merged repos are private). Run it from the Actions tab.
name: Try FF777 on examples

on:
  workflow_dispatch:
    inputs:
      model:
        description: Hugging Face model (merged weights)
        default: Frenchfries777/FF-Tools-1.7B-merged
      shards:
        description: Number of parallel jobs (1-14)
        default: '7'
      requests:
        description: Request list (json file in the repo)
        default: train/eval/example-requests.json
      max_new_tokens:
        description: Longest answer in tokens
        default: '1400'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.l.outputs.list }}
    steps:
      - id: l
        run: python3 -c "import json,os;n=int('${{ inputs.shards }}');print('list='+json.dumps(list(range(n))))" >> "$GITHUB_OUTPUT"
  try:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q transformers accelerate sentencepiece safetensors huggingface_hub
      - name: Run
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u train/ff_try.py "${{ inputs.model }}" ${{ matrix.shard }} "${{ inputs.shards }}" "${{ inputs.max_new_tokens }}" "${{ inputs.requests }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: answers-${{ matrix.shard }}
          path: out
  check:
    needs: try
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: answers
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save jsdom
      - run: node train/ff_check.js answers
