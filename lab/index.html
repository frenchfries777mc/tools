<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="copyright" content="© 2026 Frenchfries777. CC BY-NC-ND 4.0 (https://creativecommons.org/licenses/by-nc-nd/4.0/)">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fry Lab · Frenchfries777 Tools</title>
<meta name="description" content="브라우저에서 바로 하는 과학·수학 실험실. 값을 바꾸며 실험하고, 측정값을 기록해 그래프로 그려요.">
<meta name="theme-color" content="#08090d">
<link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="../i18n.js"></script>
<script src="strings.js?v=l17"></script>
<script src="strings-tpl.js?v=l17"></script>
<style>
:root{ --bg:#08090d; --panel:#10131b; --panel2:#151925; --line:#222837; --text:#eef0f5; --dim:#8a93a6; --fry:#ffc93c; --fry2:#ff8a3d; --stage:#0b0d13; --grid:rgba(138,147,166,.13); --lab:#a78bfa; }
html[data-ff-theme=light]{ --bg:#f6f3ec; --panel:#ffffff; --panel2:#f1ede4; --line:#e2dccf; --text:#1f1b14; --dim:#6d6658; --stage:#fbfaf6; --grid:rgba(80,70,50,.12); --lab:#6d4fd8; }
*{box-sizing:border-box;}
html,body{margin:0; height:100%; background:var(--bg); color:var(--text); overscroll-behavior:none;}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; font-size:14px; display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0); -webkit-tap-highlight-color:transparent;}
button,input,select,textarea{font:inherit; color:inherit;}
[hidden]{display:none!important;}
/* header (same as the other tools) */
.top{display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); flex:0 0 auto;}
.home{display:grid; place-items:center; width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--fry),var(--fry2)); text-decoration:none; font-size:18px; flex:0 0 auto;}
.brand{font-family:'Oswald',sans-serif; font-weight:700; font-size:18px; letter-spacing:.04em; white-space:nowrap;}
.brand b{color:var(--lab);}
.sub{color:var(--dim); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.sp{flex:1;}
.tbtn{display:inline-flex; align-items:center; justify-content:center; gap:6px; height:34px; padding:0 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; white-space:nowrap; flex:0 0 auto;}
.tbtn:hover:not(:disabled){border-color:#3a4256;} .tbtn:disabled{opacity:.4; cursor:default;}
.tbtn.pri{background:linear-gradient(90deg,var(--fry),var(--fry2)); color:#1c1405; border:0; font-weight:700;}
.tbtn.aib{border-color:#5a4a1c; color:var(--fry);}
.tbtn.on{border-color:var(--fry); color:var(--fry);}
.tbtn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto;}
.tbtn svg.fill{fill:currentColor; stroke:none;}
.langSel{background:var(--panel2); color:var(--dim); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13px; max-width:120px;}
@media(max-width:1000px){ .top .sub{display:none;} }
@media(max-width:620px){ .top .tbtn .lb{display:none;} .langSel{max-width:92px;} .top{gap:6px;} }
@media(max-width:480px){ .top{gap:4px; padding:8px 8px;} .top .tbtn{padding:0 8px;} .langSel{max-width:62px; padding:6px 3px;} .top .brand{font-size:15px;} }
/* layout: experiment list | stage | side panel */
.main{flex:1; min-height:0; display:grid; grid-template-columns:236px minmax(0,1fr) 356px; grid-template-rows:minmax(0,1fr);}
#nav{background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:8px 8px 30px; -webkit-overflow-scrolling:touch;}
#nav .cat{color:var(--dim); font-size:12px; font-weight:700; letter-spacing:.08em; padding:12px 10px 6px;}
.ex{display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left; padding:9px 10px; margin:0 0 2px; border-radius:10px; border:1px solid transparent; background:transparent; cursor:pointer;}
.ex:hover{background:var(--panel2);}
.ex .ic{flex:0 0 28px; height:28px; display:grid; place-items:center; font-size:19px; border-radius:8px; background:var(--panel2);}
.ex .nm{display:block; font-weight:700; font-size:14px; line-height:1.3;}
.ex .ds{display:block; color:var(--dim); font-size:12px; line-height:1.4; margin-top:2px;}
.ex.on{background:var(--panel2); border-color:rgba(167,139,250,.45);}
.ex .ic.lg{background:none;} .ex .ic img{width:100%; height:100%; display:block; border-radius:8px;} .gtpl .ic.lg img{width:26px; height:26px; display:block; border-radius:7px;}
.ex.on .nm{color:var(--lab);} .ex.on .ic{background:rgba(167,139,250,.18);}
#stage{display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--stage);}
.sbar{display:flex; align-items:center; gap:6px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap;}
.sbar .tt{display:flex; align-items:baseline; gap:10px; min-width:0; flex:1 1 180px;}
.sbar h1{margin:0; font-size:17px; font-weight:800; white-space:nowrap;}
.sbar .tt span{color:var(--dim); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.sbar .acts{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.xacts{display:contents;}
.ib{width:34px; height:34px; display:grid; place-items:center; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--text); cursor:pointer; padding:0; flex:0 0 auto;}
.ib svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
#speedSel{height:34px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); padding:0 6px; font-size:13px;}
#playBtn.on{background:var(--panel2); color:var(--fry); border:1px solid var(--fry);}
#recBtn{border-color:rgba(167,139,250,.5); color:var(--lab);}
#cvWrap{flex:1; min-height:0; position:relative; overflow:hidden;}
#cv{position:absolute; left:0; top:0; display:block; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
#hint.fade{opacity:0;}
#hint{transition:opacity .6s; position:absolute; left:12px; bottom:10px; color:var(--dim); font-size:12px; pointer-events:none; background:color-mix(in srgb,var(--stage) 80%,transparent); padding:3px 8px; border-radius:6px; max-width:calc(100% - 24px);}
#side{background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; min-width:0;}
.tabs{display:flex; gap:4px; padding:8px 10px 0; border-bottom:1px solid var(--line); flex:0 0 auto;}
.tabs button{flex:1; height:38px; border:0; border-bottom:2.5px solid transparent; background:transparent; color:var(--dim); cursor:pointer; font-weight:700; border-radius:8px 8px 0 0;}
.tabs button.on{color:var(--text); border-bottom-color:var(--lab);}
.tabs .n{display:inline-block; min-width:20px; padding:0 6px; margin-left:4px; border-radius:99px; background:var(--panel2); color:var(--dim); font-size:12px; line-height:20px;}
.tabs .n.bump{animation:bump .5s;}
@keyframes bump{40%{transform:scale(1.35); background:var(--lab); color:#160f2b;}}
.pane{flex:1; overflow-y:auto; padding:12px 14px 30px; -webkit-overflow-scrolling:touch; min-height:0;}
.h2{display:flex; align-items:center; gap:8px; color:var(--dim); font-size:12px; font-weight:700; letter-spacing:.06em; margin:14px 0 8px;}
.h2:first-child{margin-top:2px;}
.h2::after{content:''; flex:1; height:1px; background:var(--line);}
/* controls */
.prm{margin:0 0 12px;}
.prm .ph{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 4px;}
.prm label,.prm .lbl{font-size:13.5px; font-weight:500;}
.pv{display:flex; align-items:center; gap:4px; color:var(--dim); font-size:13px;}
.num{width:74px; height:30px; background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:0 6px; text-align:right; font-variant-numeric:tabular-nums; -moz-appearance:textfield;}
.num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none; margin:0;}
.num:focus{outline:none; border-color:var(--lab);}
.stp{width:34px; height:34px; flex:none; border:1px solid var(--line); background:var(--panel2); color:var(--text); border-radius:9px; font-size:20px; line-height:1; font-weight:600; cursor:pointer; padding:0; display:inline-flex; align-items:center; justify-content:center; touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;}
.stp:hover{border-color:var(--lab); color:var(--lab);}
.stp:active{background:rgba(167,139,250,.22); border-color:var(--lab);}
.stp:focus-visible{outline:2px solid var(--lab); outline-offset:1px;}
@media(pointer:coarse){ .stp{width:44px; height:44px; font-size:24px;} .num{height:40px; width:80px; font-size:16px;} .pv{gap:6px;} }
input[type=range]{width:100%; height:28px; margin:0; accent-color:var(--lab); background:transparent; touch-action:pan-y;}
.pre{display:flex; flex-wrap:wrap; gap:5px; margin-top:4px;}
.pre button,.seg button{border:1px solid var(--line); background:var(--panel2); border-radius:99px; padding:4px 10px; cursor:pointer; font-size:12.5px; color:var(--dim);}
.pre button:hover,.seg button:hover{color:var(--text);}
.pre button.on,.seg button.on{border-color:var(--lab); color:var(--lab); background:rgba(167,139,250,.12);}
.seg{display:flex; flex-wrap:wrap; gap:5px;}
.seg button{border-radius:9px; padding:7px 12px; font-size:13px;}
.chk{display:flex; align-items:center; gap:10px; cursor:pointer; font-size:13.5px; padding:4px 0;}
.chk input{width:20px; height:20px; accent-color:var(--lab); margin:0;}
.fx{display:flex; align-items:center; gap:6px; margin:0 0 8px;}
.fx i{flex:0 0 10px; height:10px; border-radius:50%;}
.fx span{font-size:13px; color:var(--dim); white-space:nowrap; font-family:Georgia,'Times New Roman',serif; font-style:italic;}
.fx input{flex:1; min-width:0; height:36px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:0 10px; font-size:15px; font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;}
.fx input:focus{outline:none; border-color:var(--lab);}
.fx input.bad{border-color:#ff6b6b;}
.fx button{width:30px; height:30px; border:0; background:transparent; color:var(--dim); cursor:pointer; font-size:18px; border-radius:6px; flex:0 0 auto;}
.fxErr{color:#ff8b8b; font-size:12px; margin:-4px 0 8px 16px;}
/* readouts */
.reads{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px;}
.rd{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:7px 10px 8px; min-width:0;}
.rd .l{display:block; color:var(--dim); font-size:12px; line-height:1.3;}
.rd .v{display:block; font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px; overflow-wrap:anywhere; line-height:1.25;}
.rd .v small{font-size:12px; color:var(--dim); font-weight:500; margin-left:3px;}
.rd.wide{grid-column:1/-1;}
.rd.hl .v{color:var(--fry);} .rd.th .v{color:#8fc2ff;} .rd.ok .v{color:#3fe08f;}
.info{background:rgba(167,139,250,.08); border:1px solid rgba(167,139,250,.25); border-radius:10px; padding:9px 12px; font-size:13px; line-height:1.6; color:var(--text);}
.try{list-style:none; margin:0; padding:0;}
.try li{position:relative; padding:7px 10px 7px 34px; margin:0 0 6px; background:var(--bg); border:1px solid var(--line); border-radius:10px; font-size:13px; line-height:1.55; cursor:pointer;}
.try li::before{content:''; position:absolute; left:11px; top:10px; width:14px; height:14px; border-radius:4px; border:1.5px solid var(--dim);}
.try li.done{color:var(--dim);} .try li.done::before{background:var(--lab); border-color:var(--lab);}
.try li.done::after{content:''; position:absolute; left:15px; top:12px; width:5px; height:8px; border:solid #160f2b; border-width:0 2px 2px 0; transform:rotate(45deg);}
/* data */
.dacts{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px;}
.dacts .tbtn{height:32px; padding:0 10px; font-size:13px;}
.dacts .dang{color:#ff8b8b;}
.dacts.auto{align-items:center;}
.dacts.auto select{height:32px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); padding:0 6px; font-size:13px; color:var(--text);}
.dacts.auto #toSheet{margin-left:auto;}
.adot{width:9px; height:9px; border-radius:50%; border:1.5px solid currentColor; flex:0 0 auto;}
#autoBtn.on{border-color:var(--lab); color:var(--lab);} #autoBtn.on .adot{background:#ff5d6c; border-color:#ff5d6c; animation:blink 1s infinite;}
#recBtn.auto{box-shadow:inset 0 0 0 1px #ff5d6c;} #recBtn.auto::after{content:''; width:7px; height:7px; border-radius:50%; background:#ff5d6c; animation:blink 1s infinite;}
@keyframes blink{50%{opacity:.25;}}
.tblWrap{max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:10px; -webkit-overflow-scrolling:touch;}
table{border-collapse:collapse; width:100%; font-size:12.5px; font-variant-numeric:tabular-nums;}
th,td{padding:6px 8px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--line);}
th{position:sticky; top:0; background:var(--panel2); color:var(--dim); font-weight:500; z-index:1;}
th:first-child,td:first-child{text-align:center; color:var(--dim); width:28px;}
td:last-child,th:last-child{width:30px; padding:0 4px;}
td .del{width:26px; height:26px; border:0; background:transparent; color:var(--dim); cursor:pointer; border-radius:6px; font-size:16px;}
td .del:hover{color:#ff8b8b; background:var(--panel2);}
.empty{color:var(--dim); font-size:13px; text-align:center; padding:18px 10px; line-height:1.6;}
.gsel{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:4px 0 8px; font-size:13px; color:var(--dim);}
.gsel select{height:32px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); padding:0 6px; max-width:150px; color:var(--text);}
.gsel .chk{margin-left:auto;}
#gcv{display:block; width:100%; height:240px; border-radius:10px; background:var(--stage); border:1px solid var(--line);}
.fitTxt{font-size:13px; margin:8px 2px 0; line-height:1.6; font-variant-numeric:tabular-nums;}
.fitTxt b{color:var(--fry);}
/* AI helper drawer */
#aiPanel{position:fixed; top:0; right:0; bottom:0; width:min(410px,100vw); z-index:90; background:var(--panel); border-left:1px solid var(--line); box-shadow:-20px 0 60px rgba(0,0,0,.45); display:flex; flex-direction:column; transform:translateX(105%); transition:transform .22s ease; visibility:hidden;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) 0;}
#aiPanel.open{transform:none; visibility:visible;}
.aih{display:flex; align-items:center; gap:8px; padding:10px 10px 10px 16px; border-bottom:1px solid var(--line);}
.aih h3{margin:0; font-size:16px; flex:1;}
.x{width:36px; height:36px; border:0; background:transparent; color:var(--dim); font-size:24px; cursor:pointer; border-radius:8px;}
.x:hover{background:var(--panel2); color:var(--text);}
.aib2{flex:1; overflow-y:auto; padding:12px 16px 16px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch;}
.aiCtx{font-size:12.5px; color:var(--dim); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px; line-height:1.55;}
.aiCtx b{color:var(--text);}
.chips{display:flex; flex-wrap:wrap; gap:6px;}
.chips button{border:1px solid var(--line); background:var(--panel2); border-radius:99px; padding:6px 11px; cursor:pointer; font-size:12.5px; text-align:left;}
.chips button:hover{border-color:var(--fry); color:var(--fry);}
.chips button.on{border-color:var(--fry); color:var(--fry); background:rgba(255,201,60,.1);}
/* report and share windows */
.repBox{width:min(640px,100%); max-height:min(88vh,860px);} .repBody{padding:4px 16px 12px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.repBody label{font-size:12.5px; color:var(--dim); margin-top:2px;} .repBody textarea{width:100%; min-height:74px; resize:vertical; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:14px; line-height:1.55;}
.repBody textarea:focus{outline:none; border-color:var(--lab);} .repImg{max-width:100%; border:1px solid var(--line); border-radius:8px; background:#fff;}
.repRow{display:flex; gap:6px; flex-wrap:wrap; align-items:center;} .repRow .sp{flex:1;} .repSt{font-size:12.5px; color:var(--dim); min-height:18px; line-height:1.5;}
.repFoot{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; padding:8px 16px 14px; border-top:1px solid var(--line);}
.shLink{width:100%; height:38px; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:0 10px; font-size:12.5px; font-family:ui-monospace,Menlo,monospace;} .shQr{align-self:center; max-width:100%; background:#fff; border-radius:8px;}
#aiQ{width:100%; min-height:76px; resize:vertical; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:15px; line-height:1.5;}
#aiQ:focus{outline:none; border-color:var(--fry);}
.aiRow{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.aiRow .sp{flex:1;}
.aiNote{color:var(--dim); font-size:12px; line-height:1.5;}
.aiLink{background:none; border:0; color:var(--fry); cursor:pointer; padding:0; font-size:13px;}
#aiOut{font-size:14.5px; line-height:1.7; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px 14px; overflow-wrap:anywhere;}
#aiOut p{margin:0 0 8px;} #aiOut p:last-child{margin-bottom:0;}
#aiOut ul,#aiOut ol{margin:0 0 8px; padding-left:20px;} #aiOut li{margin:2px 0;}
#aiOut code{background:var(--panel2); padding:1px 5px; border-radius:5px; font-size:13px;}
#aiOut .wait{color:var(--dim);}
.spin{display:inline-block; width:14px; height:14px; border-radius:50%; border:2.5px solid rgba(255,201,60,.25); border-top-color:var(--fry); animation:sp .8s linear infinite; vertical-align:-2px; margin-right:6px;}
@keyframes sp{to{transform:rotate(360deg);}}
#toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:#1d2230; color:#eef0f5; border:1px solid var(--line); padding:9px 16px; border-radius:99px; z-index:300; opacity:0; transition:opacity .2s; pointer-events:none; max-width:92vw; text-align:center;}
#toast.on{opacity:1;}
/* template gallery */
#gallery{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; background:var(--bg);}
.gwrap{max-width:1180px; margin:0 auto; padding:18px 16px 60px;}
.ghead h1{margin:0 0 4px; font-size:22px; font-weight:800;}
.ghead p{margin:0 0 14px; color:var(--dim); font-size:14px; line-height:1.6;}
.gfil{display:flex; flex-direction:column; gap:8px; margin:0 0 10px;}
.gsub{display:flex; flex-wrap:wrap; gap:6px;}
.gsub button{border:1px solid var(--line); background:var(--panel2); border-radius:99px; padding:6px 13px; cursor:pointer; font-size:13.5px; color:var(--dim); min-height:34px;}
.gsub button:hover{color:var(--text);}
.gsub button.on{border-color:var(--lab); color:var(--lab); background:rgba(167,139,250,.12); font-weight:700;}
.gsrch{display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px;}
.gsrch input[type=search]{flex:1 1 220px; min-width:0; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--panel); padding:0 12px; font-size:15px;}
.gsrch input[type=search]:focus{outline:none; border-color:var(--lab);}
.gsrch .chk{font-size:13px; color:var(--dim); padding:0;}
.gcount{color:var(--dim); font-size:12.5px; margin:6px 0 4px;}
.gh2{display:flex; align-items:center; gap:8px; margin:18px 0 8px; font-size:15px; font-weight:800;}
.gh2::after{content:''; flex:1; height:1px; background:var(--line);}
.gcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr)); gap:10px;}
.gcard{display:flex; flex-direction:column; gap:6px; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; min-width:0;}
.gcard.ok{cursor:pointer;} .gcard.ok:hover{border-color:var(--lab); background:var(--panel2);}
.gcard.soon{opacity:.62; cursor:default;}
.gtags{display:flex; flex-wrap:wrap; gap:5px; align-items:center;}
.gtag{font-size:11.5px; padding:2px 8px; border-radius:99px; background:var(--panel2); border:1px solid var(--line); color:var(--dim); white-space:nowrap;}
.gtag.m{color:#8fc2ff;} .gtag.s{color:#3fe08f;}
.gtag.soon{color:var(--dim); border-style:dashed;}
.gtag.mine{color:var(--fry); border-color:#5a4a1c;}
.gcard h3{margin:0; font-size:15.5px; font-weight:800; line-height:1.35; overflow-wrap:anywhere;}
.gcard p{margin:0; color:var(--dim); font-size:13px; line-height:1.55; flex:1;}
.gtpl{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--lab); min-width:0;}
.gtpl .ic{font-size:18px;}
.gtpl .nm{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;}
.gtpl .go{flex:0 0 auto; padding:4px 11px; border-radius:99px; background:linear-gradient(90deg,var(--fry),var(--fry2)); color:#1c1405; font-size:12.5px;}
.gcard.soon .gtpl{color:var(--dim); font-weight:500;}
.gtag.multi{color:var(--lab); border-color:var(--lab);}
.gpkback{position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.55);}
.gpk{width:min(480px,100%); max-height:min(80vh,640px); display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.4);}
.gpkhd{display:flex; align-items:flex-start; gap:8px; padding:14px 10px 8px 16px;}
.gpkt{flex:1; min-width:0;} .gpkt h3{margin:0; font-size:16px; font-weight:800; line-height:1.35; overflow-wrap:anywhere;} .gpkt span{color:var(--dim); font-size:12.5px;}
.gpkls{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 8px 12px;}
.gpkls .ex{align-items:center; min-height:48px; padding:10px; border-color:var(--line); margin-bottom:6px; color:var(--text);}
.gpkls .ex:hover,.gpkls .ex:focus-visible{border-color:var(--lab); background:var(--panel2);}
.cardBox{width:min(560px,100%);} .cardTabs{padding:0 16px 6px;} .cardBody{padding:6px 16px 16px;}
.cardBody .seg{margin:4px 0 10px;} .cardRow{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.cardNum{flex:1 1 110px; min-width:0; height:38px; padding:0 10px; border:1px solid var(--line); border-radius:9px; background:var(--bg); font-size:16px;}
.cardSel{height:38px; flex:1 1 110px; min-width:0; padding:0 8px; border:1px solid var(--line); border-radius:9px; background:var(--panel2);}
.cardRes{margin:12px 0 8px; padding:12px; border-radius:10px; background:var(--panel2); border:1px solid var(--line); font-size:17px; font-weight:800; overflow-wrap:anywhere;}
.cardAll{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px;} .cardAr{display:flex; justify-content:space-between; gap:8px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px;}
.cardAr span{color:var(--dim);} .cardAr b{overflow-wrap:anywhere; text-align:right;} .cardAr.on{border-color:var(--lab);}
.cardNote{color:var(--dim); font-size:12.5px; margin:8px 0 0;}
.cardSearch{width:100%; height:38px; padding:0 10px; border:1px solid var(--line); border-radius:9px; background:var(--bg); margin-bottom:6px;}
.cardH{margin:12px 0 6px; font-size:13px; color:var(--lab);} .fcard{padding:10px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:6px; background:var(--panel2);}
.fcard .fn{font-weight:700; font-size:14px;} .fcard .ff{margin:4px 0; font-size:16px; color:var(--fry); font-family:'JetBrains Mono','Noto Sans KR',monospace; overflow-wrap:anywhere;} .fcard .fv{color:var(--dim); font-size:12.5px;}
.fcard .tbtn{margin-top:8px; height:30px; font-size:12.5px;}
.gpkls .ex .ds{display:block;} .gpkls .gtag{margin-left:auto;}
.gempty{color:var(--dim); text-align:center; padding:40px 10px; line-height:1.7;}
.gnote{color:var(--dim); font-size:12.5px; line-height:1.6; margin:26px 0 0;}
/* my versions */
.vbox{display:flex; flex-direction:column; gap:6px;}
.vl{font-size:12.5px; color:var(--dim); margin-top:4px;}
.txin{width:100%; height:36px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:0 10px; font-size:14.5px; min-width:0;}
.txin:focus,.vedit:focus{outline:none; border-color:var(--lab);}
.prm .txin{margin-top:2px;}
.vrow{display:flex; gap:6px;} .vrow .tbtn{height:36px;}
.vlist{list-style:none; margin:2px 0 4px; padding:0; display:flex; flex-direction:column; gap:4px;}
.vlist li{display:flex; align-items:center; gap:2px; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:2px 4px 2px 2px; min-width:0;}
.vlist li.on{border-color:var(--lab);}
.vlist li.vempty{display:block; color:var(--dim); font-size:12.5px; line-height:1.55; padding:8px 10px; border-style:dashed;}
.vn{flex:1; min-width:0; text-align:left; border:0; background:transparent; cursor:pointer; padding:7px 8px; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border-radius:7px;}
.vn:hover{background:var(--panel2);}
.vi{flex:0 0 32px; height:32px; border:0; background:transparent; color:var(--dim); cursor:pointer; border-radius:7px; font-size:16px;}
.vi:hover{background:var(--panel2); color:var(--text);} .vi.arm{color:#ff8b8b;}
.vedit{flex:1; min-width:0; height:32px; background:var(--panel); border:1px solid var(--lab); border-radius:7px; padding:0 8px; font-size:14px;}
@media(max-width:620px){ .gwrap{padding:14px 16px 50px;} .ghead h1{font-size:20px;} }
/* iPad landscape and smaller laptops: the list becomes a strip on top */
@media(max-width:1180px){
  .main{grid-template-columns:minmax(0,1fr) 330px; grid-template-rows:auto minmax(0,1fr);}
  #nav{grid-column:1/-1; display:flex; gap:4px; overflow-x:auto; overflow-y:hidden; padding:6px 8px; border-right:0; border-bottom:1px solid var(--line); scrollbar-width:none;}
  #nav::-webkit-scrollbar{display:none;}
  #nav .cat{display:none;}
  .ex{width:auto; flex:0 0 auto; align-items:center; padding:5px 10px 5px 6px; margin:0; gap:7px;}
  .ex .ic{flex-basis:26px; height:26px; font-size:16px;}
  .ex .ds{display:none;} .ex .nm{font-size:13.5px; white-space:nowrap;}
}
/* iPad portrait and phones: one column that scrolls */
@media(max-width:860px){
  .main{display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;}
  #nav{flex:0 0 auto;}
  #stage{flex:0 0 auto;}
  #cvWrap{flex:none; height:clamp(300px,92vw,52vh);}
  #side{flex:0 0 auto; border-left:0; border-top:1px solid var(--line); min-height:auto;}
  .pane{overflow:visible; flex:none;}
  .sbar .tt span{display:none;}
}
@media(min-width:620px) and (max-width:860px){
  .pane.set{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0 20px; align-items:start;}
  .pane.set > .col{min-width:0;}
}
@media(max-width:600px){

  .sbar .tt{flex-basis:100%;}
  .sbar .acts{width:100%;}
  .sbar .acts .lb2{display:none;}
  .pane{padding:12px 12px 30px;}
}
