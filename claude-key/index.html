<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Claude와 연결하기</title>
<script src="../i18n.js"></script>
<style>
:root{--bg:#0e0e0e;--panel:#171717;--panel2:#121212;--line:#2e2b25;--text:#ece6d8;--dim:#a39c8c;--fry:#d9b45f;--fry2:#b8923a}
html[data-ff-theme=light]{--bg:#fff;--panel:#fff;--panel2:#f6f4ee;--line:#e4dfd2;--text:#111;--dim:#4b4b4b;--fry:#a67c00;--fry2:#d4a62a}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:40px 16px;margin:0}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
input,button{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:16px}
button,.btn{background:linear-gradient(90deg,#d9b45f,#b8923a);color:#1c1405;border:0;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;padding:10px;border-radius:10px;font-size:16px}
html[data-ff-theme=light] button,html[data-ff-theme=light] .btn{background:linear-gradient(90deg,#e0b93f,#d4a62a);color:#161616}
label{font-size:14px;color:var(--dim);margin-top:8px}
footer{margin-top:24px;font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:4px}
footer a{color:var(--text)}
</style>
<link rel="stylesheet" href="../ff-rich-app.css?v=2">
<style id="richApp">
/* rich look: Claude connect page */
html[data-ff-theme] body{font-family:'Oswald','Noto Sans KR',system-ui,sans-serif;border-top:2px solid var(--fry);min-height:100vh;box-sizing:border-box}
html[data-ff-theme] main{max-width:520px}
html[data-ff-theme] h2{font-family:'Oswald','Noto Sans KR',sans-serif;font-weight:600;font-size:36px;line-height:1.1;margin:24px 0 18px;border-left:8px solid var(--fry);padding-left:18px}
html[data-ff-theme] h2::after{display:none!important}
html[data-ff-theme] label{color:var(--fry);font-family:'Oswald','Noto Sans KR',sans-serif;font-size:15px;letter-spacing:.08em;font-weight:500}
html[data-ff-theme] input{background:transparent;border:1px solid var(--fry);border-radius:16px;color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif}
html[data-ff-theme] button,html[data-ff-theme] .btn,html[data-ff-theme=light] button,html[data-ff-theme=light] .btn{background:var(--fry);color:var(--bg);border:1px solid var(--fry);border-radius:99px;font-family:'Noto Sans KR',system-ui,sans-serif}
html[data-ff-theme] .btn{display:block}
html[data-ff-theme] footer{border-top:2px solid var(--fry);padding-top:14px;color:var(--text)}
</style>
</head>
<body>
<main>
<h2>Claude와 연결하기</h2>
<label>1. 커넥터 주소</label>
<input id="u" readonly value="https://ff-tools-mcp.frenchfries777mc.workers.dev/mcp">
<button data-copy="u">복사</button>
<label>2. 커넥터 추가 화면</label>
<a class="btn" href="https://claude.ai/settings/connectors" target="_blank" rel="noopener">Claude 커넥터 설정 열기</a>
<label>3. Tools 키 (로그인 때 한 번)</label>
<input id="k" readonly>
<button data-copy="k">복사</button>
<footer><span>Created by Frenchfries777</span><span class="ff-copy">© 2026 Frenchfries777 · <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/deed.ko" target="_blank" rel="noopener">CC BY-NC-ND 4.0</a></span></footer>
</main>
<script>
try{ if(window.FFT) FFT.add({
"Claude와 연결하기":["Connect to Claude", "Conectar con Claude", "Connecter à Claude", "Mit Claude verbinden", "Claudeと連携", "连接 Claude", "Conectar ao Claude", "Подключить Claude", "Claude ile bağla"],
"1. 커넥터 주소":["1. Connector address", "1. Dirección del conector", "1. Adresse du connecteur", "1. Connector-Adresse", "1. コネクターのアドレス", "1. 连接器地址", "1. Endereço do conector", "1. Адрес коннектора", "1. Bağlayıcı adresi"],
"2. 커넥터 추가 화면":["2. Add connector screen", "2. Pantalla para añadir conector", "2. Écran d'ajout de connecteur", "2. Connector hinzufügen", "2. コネクター追加画面", "2. 添加连接器页面", "2. Tela para adicionar conector", "2. Экран добавления коннектора", "2. Bağlayıcı ekleme ekranı"],
"Claude 커넥터 설정 열기":["Open Claude connector settings", "Abrir ajustes de conectores de Claude", "Ouvrir les réglages des connecteurs Claude", "Claude-Connector-Einstellungen öffnen", "Claudeのコネクター設定を開く", "打开 Claude 连接器设置", "Abrir configurações de conectores do Claude", "Открыть настройки коннекторов Claude", "Claude bağlayıcı ayarlarını aç"],
"3. Tools 키 (로그인 때 한 번)":["3. Tools key (once, at sign-in)", "3. Clave de Tools (una vez, al iniciar sesión)", "3. Clé Tools (une fois, à la connexion)", "3. Tools-Schlüssel (einmal beim Anmelden)", "3. Toolsキー（ログイン時に一度）", "3. Tools 密钥（登录时一次）", "3. Chave do Tools (uma vez, ao entrar)", "3. Ключ Tools (один раз, при входе)", "3. Tools anahtarı (giriş sırasında bir kez)"],
"복사":["Copy", "Copiar", "Copier", "Kopieren", "コピー", "复制", "Copiar", "Копировать", "Kopyala"],
"복사됨":["Copied", "Copiado", "Copié", "Kopiert", "コピー済み", "已复制", "Copiado", "Скопировано", "Kopyalandı"],
"키가 없어요. Tools에서 문서를 먼저 저장해 주세요.":["No key yet. Save a document in Tools first.", "No hay clave todavía. Guarda antes un documento en Tools.", "Pas encore de clé. Enregistrez d'abord un document dans Tools.", "Noch kein Schlüssel. Speichere zuerst ein Dokument in Tools.", "キーがありません。先にToolsで文書を保存してください。", "还没有密钥。请先在 Tools 中保存一个文档。", "Ainda não há chave. Salve primeiro um documento no Tools.", "Ключа пока нет. Сначала сохраните документ в Tools.", "Henüz anahtar yok. Önce Tools'ta bir belge kaydedin."]
}); }catch(e){}
function TR(s){ try{ return window.FFT&&FFT.T?FFT.T(s):s; }catch(e){ return s; } }
(function(){
  var k=document.getElementById('k'),v='';
  try{ v=localStorage.getItem('ffstore.owner')||''; }catch(e){}
  k.value=/^[0-9a-f]{32}$/.test(v)?v:TR('키가 없어요. Tools에서 문서를 먼저 저장해 주세요.');
  Array.prototype.forEach.call(document.querySelectorAll('button[data-copy]'),function(b){
    b.onclick=function(){ var f=document.getElementById(b.getAttribute('data-copy')); f.select();
      var done=function(){ b.textContent=TR('복사됨'); };
      try{ navigator.clipboard.writeText(f.value).then(done,function(){ document.execCommand('copy'); done(); }); }catch(e){ document.execCommand('copy'); done(); } };
  });
})();
</script>
</body>
</html>
