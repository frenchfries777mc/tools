<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Tools 키</title>
<script src="../i18n.js"></script>
<style>
:root{--bg:#0e0e0e;--panel:#171717;--panel2:#121212;--line:#2e2b25;--text:#ece6d8;--dim:#a39c8c;--fry:#d9b45f;--fry2:#b8923a}
html[data-ff-theme=light]{--bg:#fff;--panel:#fff;--panel2:#f6f4ee;--line:#e4dfd2;--text:#111;--dim:#4b4b4b;--fry:#a67c00;--fry2:#d4a62a}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:40px 16px;margin:0}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
input,button{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:16px}
button{background:linear-gradient(90deg,#d9b45f,#b8923a);color:#1c1405;border:0;font-weight:700;cursor:pointer}
html[data-ff-theme=light] button{background:linear-gradient(90deg,#e0b93f,#d4a62a);color:#161616}
footer{margin-top:24px;font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:4px}
footer a{color:var(--text)}
</style>
</head>
<body>
<main>
<h2>Tools 키</h2>
<input id="k" readonly>
<button id="c">복사</button>
<footer><span>Created by Frenchfries777</span><span class="ff-copy">© 2026 Frenchfries777 · <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/deed.ko" target="_blank" rel="noopener">CC BY-NC-ND 4.0</a></span></footer>
</main>
<script>
(function(){
  var k=document.getElementById('k'),b=document.getElementById('c'),v='';
  try{ v=localStorage.getItem('ffstore.owner')||''; }catch(e){}
  k.value=/^[0-9a-f]{32}$/.test(v)?v:'키가 없어요. Tools에서 문서를 먼저 저장해 주세요.';
  b.onclick=function(){ k.select(); try{ navigator.clipboard.writeText(k.value).then(function(){ b.textContent='복사됨'; },function(){ document.execCommand('copy'); b.textContent='복사됨'; }); }catch(e){ document.execCommand('copy'); b.textContent='복사됨'; } };
})();
</script>
</body>
</html>
