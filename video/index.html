<title>Fry Video · Frenchfries777 Tools</title>
<meta name="description" content="영상 클립을 자르고 이어 붙이고 글자와 소리를 넣어 mp4/webm으로 받는 브라우저 영상 편집 도구.">

<style>
:root{ --bg:#08090d; --panel:#10131b; --panel2:#151925; --line:#222837; --text:#eef0f5; --dim:#8a93a6; --fry:#ffc93c; --fry2:#ff8a3d; --desk:#0b0d13; }
html[data-ff-theme=light]{ --bg:#f6f3ec; --panel:#ffffff; --panel2:#f1ede4; --line:#e2dccf; --text:#1f1b14; --dim:#6d6658; --desk:#e6e1d6; }
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overscroll-behavior:none;}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);-webkit-tap-highlight-color:transparent;}
button,input,select,textarea{font:inherit;color:inherit;}
[hidden]{display:none!important;}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto;overflow-x:auto;scrollbar-width:none;}
.top::-webkit-scrollbar{display:none;} .top>*{flex-shrink:0;}
.home{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--fry),var(--fry2));text-decoration:none;font-size:18px;}
.brand{font-family:'Oswald',sans-serif;font-weight:700;font-size:18px;letter-spacing:.04em;white-space:nowrap;} .brand b{color:var(--fry);}
#dname{flex:1 1 100px;min-width:70px;max-width:260px;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;font-size:15px;font-weight:500;}
#dname:hover,#dname:focus{border-color:var(--line);background:var(--bg);outline:none;}
.sp{flex:1;}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;white-space:nowrap;}
.tbtn:hover:not(:disabled){border-color:#3a4256;} .tbtn:disabled{opacity:.4;cursor:default;}
.tbtn.pri{background:linear-gradient(90deg,var(--fry),var(--fry2));color:#1c1405;border:0;font-weight:700;}
.tbtn.on{background:rgba(255,201,60,.14);border-color:rgba(255,201,60,.5);color:var(--fry);}
.zoom{color:var(--dim);font-size:12px;min-width:44px;text-align:center;}
.main{flex:1 1 auto;display:flex;min-height:0;}
.tools{flex:0 0 52px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:6px;overflow-y:auto;scrollbar-width:none;}
.tools::-webkit-scrollbar{display:none;}
.tl{width:38px;height:38px;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;display:grid;place-items:center;font-size:18px;flex:0 0 auto;}
.tl:hover{background:var(--panel2);} .tl.on{background:rgba(255,201,60,.14);border-color:rgba(255,201,60,.55);}
.tl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.desk{flex:1 1 auto;min-width:0;overflow:auto;background:var(--desk);position:relative;display:grid;}
.stagew{margin:auto;padding:30px;}
#stage{display:block;box-shadow:0 6px 30px rgba(0,0,0,.45);touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair;}
.panel{flex:0 0 310px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
.ptabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto;}
.ptabs button{flex:1;height:36px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--dim);cursor:pointer;}
.ptabs button.on{color:var(--fry);border-bottom-color:var(--fry);font-weight:600;}
.pbody{flex:1 1 auto;overflow-y:auto;padding:10px 12px 20px;}
.sec{margin:0 0 14px;} .sec h4{margin:0 0 6px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.03em;}
.row{display:flex;align-items:center;gap:8px;margin:5px 0;} .row label{flex:0 0 74px;color:var(--dim);font-size:12.5px;}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--fry);} .row .v{flex:0 0 38px;text-align:right;font-size:12px;color:var(--dim);}
.row input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:transparent;cursor:pointer;}
.row input[type=number],.row select,.row input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 7px;min-width:0;}
.row input[type=number]{width:72px;}
.row select{flex:1;} .row input[type=text]{flex:1;}
.chk{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:13px;cursor:pointer;} .chk input{accent-color:var(--fry);}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;} .btns .tbtn{height:30px;padding:0 10px;font-size:13px;}
textarea{width:100%;min-height:88px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical;}
.note{color:var(--dim);font-size:12px;line-height:1.5;margin:6px 0;}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.pgrid button{padding:7px 4px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:12.5px;}
.pgrid button.on{border-color:var(--fry);color:var(--fry);background:rgba(255,201,60,.1);}
.menu{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:170px;box-shadow:0 10px 30px rgba(0,0,0,.5);}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer;} .menu button:hover{background:var(--panel2);}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:9px 16px;border-radius:10px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90vw;}
@media(max-width:820px){
  .main{flex-wrap:wrap;} .tools{flex:0 0 100%;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;order:0;}
  .desk{flex:1 1 100%;order:1;min-height:0;height:46%;} .panel{flex:1 1 100%;order:2;border-left:0;border-top:1px solid var(--line);min-height:0;height:38%;}
  .main{flex-direction:column;flex-wrap:nowrap;} .tools{flex:0 0 auto;} .desk{flex:1 1 auto;height:auto;} .panel{flex:0 0 40%;}
  .brand,.tbtn .lb{display:none;}
}

.vmain{flex-direction:column;}
.vtop{flex:1 1 auto;display:flex;min-height:0;}
.bin{flex:0 0 190px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:8px;}
.bin .it{display:flex;gap:8px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;background:var(--panel2);cursor:pointer;}
.bin .it:hover{border-color:var(--fry);} .bin .it img,.bin .it .ph{width:54px;height:36px;object-fit:cover;border-radius:5px;background:#000;flex:0 0 auto;display:grid;place-items:center;font-size:18px;}
.bin .it .nm{font-size:12px;line-height:1.3;overflow:hidden;min-width:0;} .bin .it .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;} .bin .it .nm span{color:var(--dim);}
.bin .hint{color:var(--dim);font-size:12px;line-height:1.5;padding:6px;}
.prev{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:var(--desk);align-items:center;padding:10px;gap:8px;}
.pwrap{flex:1 1 0;min-height:0;width:100%;position:relative;}
#cv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent;}
.tr{display:flex;align-items:center;gap:8px;} .tc{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;}
.tlbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line);}
.tlw{flex:0 0 232px;background:var(--panel);overflow:auto;position:relative;border-top:1px solid var(--line);}
.tlin{position:relative;min-height:100%;}
.ruler{position:sticky;top:0;height:24px;background:var(--panel2);border-bottom:1px solid var(--line);z-index:5;cursor:pointer;}
.ruler i{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-style:normal;font-size:10px;color:var(--dim);padding-left:3px;pointer-events:none;}
.lane{position:absolute;left:0;right:0;height:46px;border-bottom:1px solid var(--line);}
.lane .lb{position:sticky;left:0;display:inline-block;width:34px;height:100%;background:var(--panel2);color:var(--dim);font-size:11px;font-weight:700;display:grid;place-items:center;z-index:4;border-right:1px solid var(--line);}
.clip{position:absolute;top:4px;height:38px;border-radius:7px;border:1px solid rgba(255,255,255,.25);overflow:hidden;cursor:grab;color:#fff;font-size:11px;padding:3px 8px;white-space:nowrap;text-overflow:ellipsis;touch-action:none;}
.clip.V1{background:#3b6fb6;} .clip.V2{background:#7a4ab8;} .clip.T{background:#c27a1c;} .clip.A{background:#2a8c6a;}
.clip.sel{outline:2px solid var(--fry);z-index:3;}
.clip .hl,.clip .hr{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;background:rgba(255,255,255,.28);}
.clip .hl{left:0;} .clip .hr{right:0;}
#phead{position:absolute;top:0;bottom:0;width:2px;background:#e8453c;z-index:7;pointer-events:none;} #phead:before{content:'';position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:#e8453c;}
.expbox{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:80;} .expbox>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(420px,92vw);}
.bar{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden;margin:10px 0;} .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fry),var(--fry2));}
@media(max-width:900px){ .vtop{flex-wrap:wrap;overflow-y:auto;} .bin{flex:1 1 100%;max-height:92px;border-right:0;border-bottom:1px solid var(--line);} .prev{flex:1 1 100%;} .panel{flex:1 1 100%;border-left:0;max-height:220px;} .tlw{flex-basis:190px;} }

</style>
</head>
<body>
<div class="top">
  <a class="home" href="../" title="Tools 홈">🍟</a>
  <span class="brand">FRY <b>VIDEO</b></span>
  <input id="dname" value="이름 없는 영상" aria-label="영상 이름" data-notr>
  <button class="tbtn" id="bUndo" title="되돌리기 (Ctrl+Z)">↶<span class="lb"> 되돌리기</span></button>
  <button class="tbtn" id="bRedo" title="다시 (Ctrl+Y)">↷<span class="lb"> 다시</span></button>
  <span class="sp"></span>
  <button class="tbtn" id="bAdd">+ 파일 넣기</button>
  <button class="tbtn pri" id="bExp">영상 만들기</button>
</div>
<div class="main vmain">
  <div class="vtop">
    <div class="bin" id="bin"></div>
    <div class="prev"><div class="pwrap"><canvas id="cv" width="1280" height="720"></canvas></div>
      <div class="tr"><button class="tbtn" id="bBack" title="맨 앞으로">⏮</button><button class="tbtn pri" id="bPlay">▶</button><button class="tbtn" id="bFrame" title="지금 장면을 PNG로">📷</button><span class="tc" id="tc">0:00.0 / 0:00.0</span></div>
    </div>
    <div class="panel"><div class="ptabs" id="ptabs"><button data-p="clip" class="on">클립</button><button data-p="proj">영상 설정</button></div><div class="pbody" id="pbody"></div></div>
  </div>
  <div class="tlbar"><button class="tbtn" id="bSplit" title="재생 막대 위치에서 자르기 (S)">✂ 자르기</button><button class="tbtn" id="bDup">복제</button><button class="tbtn" id="bDel">지우기</button><button class="tbtn" id="bText">T 글자 넣기</button><span class="sp"></span><button class="tbtn" id="bTm">−</button><span class="zoom" id="zl">60px/초</span><button class="tbtn" id="bTp">+</button></div>
  <div class="tlw" id="tl"><div class="tlin" id="tlin"></div></div>
</div>
<div id="expbox" class="expbox" hidden></div>
<input type="file" id="fileIn" accept="video/*,image/*,audio/*" multiple hidden>
<script src="../ai.js?v=ai36.l21"></script>
<script src="app.js?v=vd1"></script>
<script src="../pwa.js" defer></script>
<script src="../ping.js" defer></script>
</body>
</html>
