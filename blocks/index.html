<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Block HTML · Frenchfries777 Tools</title>
<meta name="description" content="자바스크립트를 블록으로 조립해서 HTML 파일로 받는 웹페이지 만들기 도구.">
<meta name="theme-color" content="#08090d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="../i18n.js"></script>
<script src="strings.js"></script>
<script src="lib/blockly_compressed.js"></script>
<script src="lib/blocks_compressed.js"></script>
<script src="lib/javascript_compressed.js"></script>
<script>document.write('<script src="lib/msg/'+FFT.lang+'.js"><\/script>');</script>
<style>
:root{ --bg:#08090d; --panel:#10131b; --panel2:#151925; --line:#222837; --text:#eef0f5; --dim:#8a93a6; --fry:#ffc93c; --fry2:#ff8a3d; }
*{box-sizing:border-box;}
html,body{margin:0; height:100%; background:var(--bg); color:var(--text); overscroll-behavior:none;}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; font-size:14px; display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0); -webkit-tap-highlight-color:transparent;}
button,input,select{font:inherit; color:inherit;}
.top{display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); flex:0 0 auto;}
.home{display:grid; place-items:center; width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--fry),var(--fry2)); text-decoration:none; font-size:18px; flex:0 0 auto;}
.brand{font-family:'Oswald',sans-serif; font-weight:700; font-size:18px; letter-spacing:.04em; white-space:nowrap;}
.brand b{color:var(--fry);}
#projName{flex:1 1 120px; min-width:60px; max-width:300px; background:transparent; border:1px solid transparent; border-radius:8px; padding:6px 8px; font-size:15px; font-weight:500;}
#projName:hover,#projName:focus{border-color:var(--line); background:var(--bg); outline:none;}
.sp{flex:1;}
.tbtn{display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; white-space:nowrap;}
.tbtn:hover{border-color:#3a4256;} .tbtn.pri{background:linear-gradient(90deg,var(--fry),var(--fry2)); color:#1c1405; border:0; font-weight:700;}
.tbtn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
.langSel{background:var(--panel2); color:var(--dim); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13px;}
.seg{display:none; padding:3px; border-radius:99px; border:1px solid var(--line); background:var(--bg); flex:0 0 auto;}
.seg button{border:0; background:transparent; color:var(--dim); padding:5px 12px; border-radius:99px; cursor:pointer; font-size:13px; white-space:nowrap;}
.seg button.on{background:linear-gradient(90deg,var(--fry),var(--fry2)); color:#1c1405; font-weight:700;}
.main{flex:1; display:flex; min-height:0;}
#ws{flex:1 1 60%; min-width:0; position:relative;}
#side{flex:0 0 40%; max-width:560px; min-width:300px; display:flex; flex-direction:column; border-left:1px solid var(--line); background:var(--panel);}
.stabs{display:flex; align-items:center; gap:4px; padding:6px 8px; border-bottom:1px solid var(--line);}
.stab{border:0; background:transparent; color:var(--dim); padding:7px 12px; border-radius:8px; cursor:pointer;}
.stab.on{background:var(--panel2); color:var(--text);}
.stabs .sp{flex:1;}
.ib{width:34px; height:34px; display:grid; place-items:center; border-radius:8px; border:1px solid transparent; background:transparent; color:var(--dim); cursor:pointer;}
.ib:hover{background:var(--panel2); color:var(--text); border-color:var(--line);}
.ib svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.pane{flex:1; min-height:0; display:none; position:relative;}
.pane.on{display:flex; flex-direction:column;}
#frame{flex:1; width:100%; border:0; background:#fff;}
#code{flex:1; margin:0; overflow:auto; padding:14px; font-family:'JetBrains Mono',monospace; font-size:12.5px; line-height:1.6; color:#d6dbe6; white-space:pre; tab-size:2; background:#0b0d13; -webkit-user-select:text; user-select:text;}
#code .k{color:#ffb86b;} #code .s{color:#9be29b;} #code .c{color:#6b7488;} #code .t{color:#7cc4ff;}
.hint{font-size:12px; color:var(--dim); padding:6px 12px; border-top:1px solid var(--line);}
@media(max-width:900px){
  .seg{display:inline-flex;}
  #side{position:absolute; inset:auto 0 0 0; top:0; max-width:none; min-width:0; border-left:0; display:none; z-index:5;}
  .main{position:relative;}
  body.v-prev #side, body.v-code #side{display:flex;}
  .stabs .stab{display:none;}
}
@media(max-width:620px){ .brand{display:none;} .tbtn .lb{display:none;} #projName{max-width:none;} .top{flex-wrap:wrap;} .top .sp{display:none;} .seg{order:9; flex:1 1 auto; justify-content:center;} .seg button{flex:1;} [data-lang-slot]{order:10;} .langSel{max-width:96px;} }
.menu{position:fixed; z-index:60; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px; min-width:230px; box-shadow:0 20px 50px rgba(0,0,0,.55); display:none; max-height:80vh; overflow:auto;}
.menu.open{display:block;}
.menu button{display:flex; flex-direction:column; align-items:flex-start; width:100%; padding:9px 12px; border:0; background:transparent; border-radius:8px; cursor:pointer; text-align:left;}
.menu button small{color:var(--dim); font-size:12px;}
.menu button:hover{background:var(--panel2);}
.menu button.dang{color:#ff7b7b;}
.menu hr{border:0; border-top:1px solid var(--line); margin:6px 4px;}
#toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:#1d2230; border:1px solid var(--line); padding:9px 16px; border-radius:99px; z-index:70; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap;}
#toast.on{opacity:1;}
/* Blockly dark touches */
.blocklyToolboxDiv{border-right:1px solid var(--line);}
.blocklyTreeRow{height:auto!important; padding:6px 8px!important; margin-bottom:2px!important; border-radius:0 8px 8px 0;}
.blocklyTreeLabel{font-family:'Noto Sans KR',sans-serif!important; font-size:14px!important; color:#dfe3ec!important;}
.blocklyTreeSelected .blocklyTreeLabel{color:#fff!important;}
.blocklyText,.blocklyFlyoutLabelText{font-family:'Noto Sans KR',sans-serif!important;}
.blocklyMainBackground{stroke:none!important;}
.blocklyWidgetDiv .blocklyMenu,.blocklyDropDownDiv{font-family:'Noto Sans KR',sans-serif!important;}
/* toolbox section headings */
.blocklyTreeSeparator.tbHead{border:0!important; height:auto!important; margin:10px 0 4px!important; padding:4px 10px 2px; font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--fry); white-space:nowrap;}
.blocklyTreeSeparator.tbHead-make{margin-top:2px!important;}
.blocklyFlyoutLabelText{fill:#8a93a6!important; font-size:16px!important; font-weight:700;}
.blocklyFlyoutButton .blocklyFlyoutButtonBackground,.blocklyFlyoutButtonBackground{fill:#2a3142!important; stroke:#3a4256!important;}
.blocklyFlyoutButton .blocklyText{fill:#eef0f5!important; font-size:19px!important;}
/* dialogs */
.ov{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:80; display:none; align-items:center; justify-content:center; padding:12px;}
.ov.open{display:flex;}
.dlg{background:var(--panel); border:1px solid var(--line); border-radius:16px; width:min(900px,100%); max-height:94vh; display:flex; flex-direction:column; box-shadow:0 30px 80px rgba(0,0,0,.6);}
.dh{display:flex; align-items:center; gap:8px; padding:10px 12px 10px 16px; border-bottom:1px solid var(--line);}
.dh h3{margin:0; font-size:16px; flex:1;}
.x{width:36px; height:36px; border:0; background:transparent; color:var(--dim); font-size:24px; cursor:pointer; border-radius:8px;}
.x:hover{background:var(--panel2); color:var(--text);}
.padTools{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 12px;}
.padTools .grp{display:flex; gap:4px; align-items:center;}
.tl{height:38px; min-width:38px; padding:0 10px; border-radius:9px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; display:inline-flex; align-items:center; gap:5px;}
.tl.on{border-color:var(--fry); color:var(--fry); background:#2a2410;}
.sw{width:30px; height:30px; border-radius:50%; border:2px solid #3a4256; cursor:pointer; padding:0; position:relative; flex:0 0 auto;}
.sw.on{outline:3px solid var(--fry); outline-offset:1px;}
.sw.pick{background:conic-gradient(#ef4444,#facc15,#22c55e,#38bdf8,#a855f7,#ef4444); overflow:hidden;}
.sw.pick input{position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer;}
#padSw{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
#padSize{width:110px;}
#padDot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--text);}
#padWrap{margin:0 12px; border-radius:12px; overflow:hidden; background:#fff; border:1px solid var(--line); display:flex; justify-content:center; min-height:0; flex:1 1 auto;}
#padWrap.clear{background-color:#e5e7eb; background-image:linear-gradient(45deg,#cbd0d8 25%,transparent 25%,transparent 75%,#cbd0d8 75%),linear-gradient(45deg,#cbd0d8 25%,transparent 25%,transparent 75%,#cbd0d8 75%); background-size:20px 20px; background-position:0 0,10px 10px;}
#padCv{display:block; width:100%; max-width:calc((94vh - 230px) * 4 / 3); aspect-ratio:4/3; touch-action:none; cursor:crosshair;}
.padFoot{display:flex; gap:8px; align-items:center; padding:10px 12px; flex-wrap:wrap;}
.padFoot input[type=text]{flex:1 1 160px; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px;}
.padFoot label{display:flex; align-items:center; gap:6px; color:var(--dim); font-size:13px;}
#mgrList{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; padding:12px; overflow:auto;}
.pic{border:1px solid var(--line); border-radius:12px; background:var(--panel2); padding:8px; display:flex; flex-direction:column; gap:6px;}
.pic .th{height:100px; border-radius:8px; background:#fff; display:grid; place-items:center; overflow:hidden;}
.pic .th.clear{background:#e5e7eb;}
.pic .th img{max-width:100%; max-height:100%;}
.pic input{background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:5px 8px; font-size:13px; width:100%;}
.pa{display:flex; gap:4px;}
.pa button{flex:1; height:30px; border-radius:7px; border:1px solid var(--line); background:var(--panel); cursor:pointer; font-size:12.5px; padding:0 4px;}
.pa button.dang{color:#ff7b7b;}
.empty{color:var(--dim); text-align:center; padding:30px 10px; grid-column:1/-1;}
</style>
</head>
<body class="v-blocks">
<header class="top">
  <a class="home" href="../" aria-label="도구 목록">🍟</a>
  <span class="brand" data-notr>BLOCK <b>HTML</b></span>
  <input id="projName" value="나의 웹페이지" aria-label="프로젝트 이름" spellcheck="false">
  <span class="sp"></span>
  <span class="seg" id="seg"><button data-v="blocks" class="on">블록</button><button data-v="prev">미리보기</button><button data-v="code">코드</button></span>
  <button class="tbtn" id="exBtn"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg><span class="lb">예제</span></button>
  <button class="tbtn" id="fileBtn"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg><span class="lb">파일</span></button>
  <button class="tbtn pri" id="dlBtn"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg><span class="lb">HTML 받기</span></button>
  <span data-lang-slot></span>
</header>
<div class="main">
  <div id="ws" data-notr></div>
  <aside id="side">
    <div class="stabs">
      <button class="stab on" data-p="prev">미리보기</button><button class="stab" data-p="code">HTML 코드</button>
      <span class="sp"></span>
      <button class="ib" id="rerun" title="다시 실행"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
      <button class="ib" id="openTab" title="새 탭에서 열기"><svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
      <button class="ib" id="copyCode" title="코드 복사"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
    </div>
    <div class="pane on" id="pPrev"><iframe id="frame" title="미리보기" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe></div>
    <div class="pane" id="pCode"><pre id="code" data-notr></pre></div>
    <div class="hint" id="hint">블록을 바꾸면 미리보기가 바로 바뀌어요.</div>
  </aside>
</div>
<div class="menu" id="exMenu"></div>
<div class="menu" id="fileMenu">
  <button data-f="new">새 프로젝트<small>빈 페이지에서 시작</small></button>
  <hr>
  <button data-f="save">프로젝트 파일로 저장<small>블록을 .json 파일로 받아요. 나중에 다시 열 수 있어요</small></button>
  <button data-f="open">프로젝트 파일 열기<small>저장해 둔 .json 파일</small></button>
  <hr>
  <button data-f="html">HTML 파일로 받기<small>어디서든 열리는 웹페이지 파일</small></button>
</div>
<div class="ov" id="padDlg"><div class="dlg">
  <div class="dh"><h3>그림 그리기</h3><button class="x" data-close aria-label="닫기">×</button></div>
  <div class="padTools">
    <span class="grp"><button class="tl on" data-tool="pen">✏️ 펜</button><button class="tl" data-tool="fill">🪣 채우기</button><button class="tl" data-tool="eraser">🧽 지우개</button></span>
    <span id="padSw"></span>
    <span class="grp"><input type="range" id="padSize" min="2" max="60" value="8" aria-label="굵기"><span id="padDot"></span></span>
    <span class="grp"><button class="tl" id="padUndo">↶ 되돌리기</button><button class="tl" id="padClear">모두 지우기</button></span>
  </div>
  <div id="padWrap"><canvas id="padCv" width="800" height="600"></canvas></div>
  <div class="padFoot"><input type="text" id="padName" aria-label="그림 이름" data-notr><label><input type="checkbox" id="padBg"> 투명 배경</label><button class="tbtn" data-close>취소</button><button class="tbtn pri" id="padSave">저장하고 넣기</button></div>
</div></div>
<div class="ov" id="mgrDlg"><div class="dlg">
  <div class="dh"><h3>내 그림</h3><button class="tbtn" id="mgrDraw">✏️ 그림 그리기</button><button class="tbtn" id="mgrPhoto">📷 사진 넣기</button><button class="x" data-close aria-label="닫기">×</button></div>
  <div id="mgrList"></div>
</div></div>
<input type="file" id="photoIn" accept="image/*" hidden>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div id="toast"></div>
<script src="blocks.js"></script>
<script src="examples.js"></script>
<script src="app.js"></script>
</body>
</html>
